# Frensense Taint Entry Points
# Defines where taint actually enters a program — at function parameters
# with specific type annotations, not at any identifier matching a regex.
#
# Users can add custom entry points by placing additional .toml files
# in a directory and passing --extra-taint-rules <dir> (shared with taint rules).
#
# param_index: 0-based index of the parameter that carries user input.
#   Omit or set to -1 to match any parameter index.
# type_pattern: regex matching the type annotation. Omit to match any type.

# Rust / Axum — extractor types signal user-controlled input
[[entry_points]]
language = "rust"
type_pattern = "Json|Query|Form|Path|Extension|Multipart|Bytes"
rule_ids = []

# TypeScript / Express — first param is typically Request
[[entry_points]]
language = "typescript"
type_pattern = "Request|IncomingMessage"
param_index = 0
rule_ids = []

# TypeScript / Fastify
[[entry_points]]
language = "typescript"
type_pattern = "FastifyRequest"
param_index = 0
rule_ids = []

# Python / FastAPI — extractor types signal user-controlled input
[[entry_points]]
language = "python"
type_pattern = "Body|Query|Path|Form|File|Request"
rule_ids = []
