id = "ts-cmdi-spawn-args"
title = "Command injection via child_process.spawn()"
tier = 1
cwe = "CWE-78"
cvss_base = 9.8
cvss_vector = "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:H/A:H"
owasp = "A03:2021"
severity = "Critical"
languages = ["typescript", "javascript"]
frameworks = ["express", "fastify", "hono"]
runtime_probe = "cmdi"
is_security = true
category = "injection"

observation = """
User-controlled input is passed to spawn() as the file argument or used with
shell: true, enabling arbitrary binary or shell command execution.
"""

impact = """
An attacker can execute arbitrary binaries or shell commands. With shell: true,
shell metacharacters enable full command injection.
"""

improvement = """
Hardcode the binary path and pass user input only as array arguments.
Never use shell: true with user-controlled input. Validate arguments against
a strict pattern.
"""
