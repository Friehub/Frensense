id = "ts-cmdi-exec-async"
title = "Command injection via synchronous/async exec() variants"
tier = 1
cwe = "CWE-78"
cvss_base = 9.8
cvss_vector = "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:H/A:H"
owasp = "A03:2021"
severity = "Critical"
languages = ["typescript", "javascript"]
frameworks = ["express", "fastify"]
runtime_probe = "cmdi"
is_security = true
category = "injection"

observation = """
execSync() or promisify(exec) is called with user-controlled input. The sync
or async wrapper provides no security benefit — shell injection works the same.
"""

impact = """
Arbitrary command execution with the process's permissions. execSync() also
blocks the event loop, enabling denial-of-service via long-running commands.
"""

improvement = """
Replace execSync() or promisify(exec) with execFile() and pass arguments
as an array. For truly async workflows, use execFile wrapped in a promise.
"""
