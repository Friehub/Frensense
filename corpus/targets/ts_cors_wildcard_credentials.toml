id = "ts_cors_wildcard_credentials"
name = "CORS Wildcard with Credentials"
description = "Returning `Access-Control-Allow-Origin: *` together with `Access-Control-Allow-Credentials: true`."
severity = "Medium"
impact = "Browsers will reject the preflight request with an opaque CORS error because credentialed requests cannot use a wildcard origin per the Fetch spec."
improvement = "Only set `Access-Control-Allow-Credentials: true` when the origin is not `*`."
tags = ["bug", "cors", "network"]
