rules:
  - id: "BATTLE_TEST_INTER_PROCEDURAL_LEAK"
    name: "Inter-procedural Leak (Battle Test)"
    domain: "security"
    category: "Architecture"
    severity: Critical
    target_ext: "rs"
    on_node: "function_item"
