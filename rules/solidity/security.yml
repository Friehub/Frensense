rules:
  - id: "SOL_INTEGER_OVERFLOW"
    domain: "security"
    target_ext: "sol"
    on_node: "unchecked_statement"
    if_matches: "unchecked"
    impact: "Unchecked arithmetic can lead to silent integer overflows or underflows if the developer hasn't manually verified the safety of the operation. Modern Solidity (>=0.8.0) handles this by default; 'unchecked' blocks bypass this protection."
    improvement: "Ensure the 'unchecked' block is absolutely necessary for gas optimization and that inputs are pre-validated."
    observation: "I found an 'unchecked' arithmetic block. Please verify that overflow is physically impossible here."

  - id: "SOL_MISSING_ACCESS_CONTROL"
    domain: "security"
    target_ext: "sol"
    on_node: "function_definition"
    if_matches: "function.*(external|public)"
    must_contain: "(onlyOwner|onlyAdmin|require|if.*msg\\.sender)"
    impact: "Public or external functions that are missing access control modifiers can be executed by anyone, potentially allowing unauthorized state changes or fund drainage."
    improvement: "Add an 'onlyOwner' modifier or an explicit 'require(msg.sender == ...)' check."
    observation: "I noticed a public/external function that doesn't appear to have access control. Is this intended to be permissionless?"
