rules:
  - id: "SOL_STATE_MUTATION_CHECK"
    domain: "gas_optimization"
    target_ext: "sol"
    observation: "Hey, I noticed a state mutation that looks like it might be inside a view or pure context."
    impact: "State mutations in read-only functions can sometimes cause transaction reverts or unexpected gas costs."
    improvement: "It's a good idea to verify if this mutation is essential, or consider emitting an event instead if you only need tracking."
    on_node: "(assignment_expression) @node"
    if_matches: "="
    within_scope: "function_definition"

  - id: "SOL_SELFDESTRUCT_ADVISORY"
    domain: "security"
    target_ext: "sol"
    observation: "Just a quick note: 'selfdestruct' is being used here."
    impact: "Contract destruction is a high-impact event that can sometimes lock funds or break integrations for users."
    improvement: "A 'Pausable' or 'Deprecated' state pattern might be a safer alternative for predictable lifecycle management."
    on_node: "(expression_statement) @node"
    if_matches: "selfdestruct"

  - id: "SOL_PRAGMA_STABILITY"
    domain: "stability"
    target_ext: "sol"
    observation: "We noticed a floating pragma (e.g., ^0.8.0) in the contract header."
    impact: "Floating pragmas can lead to non-deterministic builds if different compiler versions are used across environments."
    improvement: "We recommend locking the pragma to a specific compiler version for consistent, verifiable deployments."
    on_node: "(pragma_directive) @node"
    if_matches: "\\^"

  - id: "SOL_ACCESS_CONTROL_SETTER"
    domain: "security"
    target_ext: "sol"
    observation: "We observed a state mutation in a function that may be missing access control."
    impact: "Publicly accessible setters can allow unauthorized users to modify critical protocol parameters."
    improvement: "Ensure this function is protected by an access control modifier like 'onlyOwner' or 'onlyRole'."
    on_node: "(function_definition) @node"
    if_matches: "function [a-zA-Z0-9_]+\\s*\\(.*\\)\\s*(public|external)"
    must_contain: "(onlyOwner|onlyRole|onlyOperator|onlyAdmin)"

  - id: "SOL_ZERO_ADDRESS_CHECK"
    domain: "quality"
    target_ext: "sol"
    observation: "We noticed an address assignment that might be missing a zero-address check."
    impact: "Setting critical parameters to the zero address can accidentally 'brick' contract functionality."
    improvement: "We recommend adding a check: require(_address != address(0), 'ZeroAddress');"
    on_node: "(function_definition) @node"
    if_matches: "function.*\\(.*address .*\\)"
    must_contain: "address\\(0\\)"

  - id: "SOL_MISSING_EVENT_INDEX"
    domain: "quality"
    target_ext: "sol"
    observation: "We noticed an event parameter that is not 'indexed'."
    impact: "Missing 'indexed' attributes on critical event parameters (like addresses) makes it difficult to filter and search for events off-chain."
    improvement: "Consider adding the 'indexed' keyword to parameters that are frequently used for filtering (e.g., event Transfer(address indexed from, ...))."
    on_node: "(event_definition) @node"
    must_not_contain: "\\(address [a-zA-Z0-9_]+\\)"

  - id: "SOL_HARDCODED_ADDRESS"
    domain: "security"
    target_ext: "sol"
    observation: "We observed a hardcoded hexadecimal address literal."
    impact: "Hardcoding addresses (other than the zero address) makes the contract inflexible and prone to errors during multi-chain deployment or upgrades."
    improvement: "We suggest passing addresses through the constructor or using a Registry/Factory pattern for better flexibility."
    on_node: "(number_literal) @node"
    if_matches: "0x[a-fA-A0-9]{40}"

  - id: "SOL_TX_ORIGIN"
    domain: "security"
    target_ext: "sol"
    observation: "We noticed 'tx.origin' being used for authentication."
    impact: "Using 'tx.origin' makes the contract vulnerable to phishing-style reentrancy attacks. An attacker can trick a user into calling a malicious contract that then calls your contract."
    improvement: "We recommend using 'msg.sender' for authentication instead."
    on_node: "(identifier) @node"
    if_matches: "tx\\.origin"

  - id: "SOL_TIMESTAMP_DEPENDENCY"
    domain: "security"
    target_ext: "sol"
    observation: "I noticed the use of 'block.timestamp' for timing logic."
    impact: "Block timestamps can be slightly manipulated by miners, which might be risky if relied upon for critical logic like randomness."
    improvement: "Consider using an external oracle (like Chainlink) for high-precision randomness or coarse timing checks."
    on_node: "(identifier) @node"
    if_matches: "block\\.timestamp"

  - id: "SOL_REENTRANCY_RISK"
    domain: "security"
    target_ext: "sol"
    observation: "I noticed an external call that might be missing a reentrancy guard."
    impact: "External calls (like '.call{value: ...}') can trigger fallback functions, leading to reentrancy vulnerabilities if not properly protected."
    improvement: "Consider adding a 'nonReentrant' modifier to this function, or ensure the Checks-Effects-Interactions pattern is strictly followed."
    on_node: "(function_definition) @node"
    if_matches: "\\.call\\s*\\{"
    must_not_contain: "nonReentrant"

  - id: "SOL_PRECISION_LOSS"
    domain: "fintech"
    target_ext: "sol"
    observation: "It looks like a division operation occurs before multiplication here."
    impact: "In Solidity, integer division truncates. Dividing before multiplying can lead to significant precision loss in financial calculations."
    improvement: "A great rule of thumb is to perform all multiplications before divisions to preserve precision."
    on_node: "(binary_expression) @node"
    if_matches: "/[^;]*\\*"
