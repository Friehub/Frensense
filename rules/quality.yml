rules:
  # --- Rust Specific Quality ---
  - id: RUST_GOD_FUNCTION
    domain: quality
    target_ext: "rs"
    on_node: "function_item"
    max_lines: 100
    observation: "God Function: block length exceeds institutional threshold (100 lines)."
    impact: "Institutional Law #2: Oversized functions indicate mixed concerns and low readability."
    improvement: "Decompose logic into smaller, testable units or helper functions."

  - id: RUST_NESTING_LIMIT
    domain: quality
    target_ext: "rs"
    on_node: "function_item"
    max_depth: 4
    observation: "Deep Nesting: logical depth exceeds institutional limit (4 levels)."
    impact: "Rule #vibecoding: Extreme indentation indicates complex, unmaintainable logic."
    improvement: "Extract inner logic into helper functions to flatten the code."

  # --- TS/JS Specific Quality ---
  - id: TS_GOD_FUNCTION
    domain: quality
    target_ext: "ts"
    on_node: "function_declaration|method_definition|arrow_function"
    max_lines: 100
    observation: "God Function: block length exceeds institutional threshold (100 lines)."
    impact: "Institutional Law #2: Oversized functions indicate mixed concerns."
    improvement: "Decompose logic into smaller, testable units."

  - id: TS_NESTING_LIMIT
    domain: quality
    target_ext: "ts"
    on_node: "function_declaration|method_definition|arrow_function"
    max_depth: 4
    observation: "Deep Nesting: logical depth exceeds institutional limit (4 levels)."
    impact: "Rule #vibecoding: Extreme indentation indicates complex logic."
    improvement: "Extract inner logic into helper functions."
