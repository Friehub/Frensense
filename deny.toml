[advisories]
vulnerability = "deny"
unmaintained = "all"
yanked = "deny"

[licenses]
unlicensed = "deny"
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-3-Clause",
  "ISC",
  "Unicode-DFS-2016"
]

[bans]
multiple-versions = "warn"
deny = [
  { name = "openssl", reason = "use rustls instead for security and easier cross-compilation" },
]
