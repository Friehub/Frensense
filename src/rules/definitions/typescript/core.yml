rules:
- id: JS_DYNAMIC_EXECUTION
  target_ext: js
  observation: We observed a pattern of dynamic code execution using 'eval()'.
  impact: Dynamic execution can introduce unpredictability and increase the surface
    area for logic vulnerabilities in isolate environments.
  improvement: Consider using a static mapping or a predefined registry to handle
    dynamic logic securely.
  on_node: call_expression
  if_matches: eval\(
  name: Js Dynamic Execution
  severity: Warning
  tags: []
  category: Security
- id: TS_DYNAMIC_EXECUTION
  target_ext: ts
  observation: We observed a pattern of dynamic code execution using 'eval()'.
  impact: Dynamic execution can introduce unpredictability and increase the surface
    area for logic vulnerabilities in isolate environments.
  improvement: Consider using a static mapping or a predefined registry to handle
    dynamic logic securely.
  on_node: call_expression
  if_matches: eval\(
  name: Ts Dynamic Execution
  severity: Warning
  tags: []
  category: Security
- id: TS_ALIASED_DYNAMIC_EXECUTION
  target_ext: ts
  observation: Aliased dynamic code execution detected.
  impact: Aliasing 'eval' to another variable can be used to bypass static analysis
    and execute arbitrary code dynamically.
  improvement: Avoid dynamic execution. If necessary, ensure strict input sanitization.
  on_node: '[ (function_declaration) (method_definition) (arrow_function) ] @node'
  source_pattern: ^eval$
  sink_pattern: <EXECUTE>
  name: Ts Aliased Dynamic Execution
  severity: Warning
  tags: []
  category: Security
- id: TS_CONSOLE_USAGE
  target_ext: ts
  observation: I noticed 'console.log' being used here.
  impact: Direct console outputs can be tricky to filter in production logs.
  improvement: Consider using the standard logger (e.g. Pino, Winston) for better
    observability.
  on_node: call_expression
  if_matches: console\.log
  name: Ts Console Usage
  severity: Warning
  tags: []
  category: Quality
- id: TS_BLOCKING_IO
  target_ext: ts
  observation: We observed a synchronous I/O call within a potentially asynchronous
    execution path.
  impact: Synchronous calls block the event loop, which can significantly reduce the
    responsiveness of the service under load.
  improvement: Consider using the asynchronous version of this call to keep the event
    loop moving smoothly.
  on_node: call_expression
  if_matches: Sync\(
  name: Ts Blocking Io
  severity: Warning
  tags: []
  category: Performance
- id: TS_EMPTY_CATCH
  target_ext: ts
  observation: Hey, it looks like this catch block is empty.
  impact: Silently swallowing errors makes debugging very difficult and can leave
    the app in a weird state.
  improvement: It's usually best to at least log the error, or re-throw it if you
    can't handle it here.
  on_node: (catch_clause) @node
  must_not_contain: \{\s*\}
  name: Ts Empty Catch
  severity: Warning
  tags: []
  category: Reliability
- id: TS_NON_NULL_ASSERTION
  target_ext: ts
  observation: We noticed a non-null assertion (!) being used.
  impact: 'Non-null assertions bypass TypeScript''s safety checks and can lead to
    runtime ''TypeError: Cannot read property of null'' errors.'
  improvement: Consider using optional chaining (?.) or an explicit null check for
    better runtime safety.
  on_node: (non_null_expression) @node
  name: Ts Non Null Assertion
  severity: Warning
  tags: []
  category: Quality
- id: TS_MAGIC_NUMBER
  target_ext: ts
  observation: We noticed a raw numeric literal (magic number) being used.
  impact: Magic numbers make code harder to read and maintain as their intent is not
    immediately clear.
  improvement: We recommend defining a named constant (e.g., const MAX_RETRIES = 3;)
    for better clarity.
  on_node: (number) @node
  if_matches: ^[0-9]{3,}$
  name: Ts Magic Number
  severity: Warning
  tags: []
  category: Maintainability
- id: TS_ANY_TYPE
  target_ext: ts
  observation: I spotted an 'any' type annotation.
  impact: Using 'any' completely disables TypeScript's safety checks for that variable.
  improvement: Consider using 'unknown' and narrowing the type, or defining a strict
    interface.
  on_node: '[ (type_identifier) (predefined_type) ] @node'
  if_matches: any
  name: Ts Any Type
  severity: Warning
  tags: []
  category: Quality
- id: TS_REACT_HOOK_DEPS
  target_ext: tsx
  observation: I noticed a 'useEffect' hook with an empty dependency array [].
  impact: Empty dependency arrays can cause stale closures if the hook references
    variables from the component scope.
  improvement: Double check that all referenced variables are included in the dependency
    array to ensure the UI stays in sync.
  on_node: call_expression
  if_matches: (?s)useEffect\(.*\s*,\s*\[\s*\]\)
  name: Ts React Hook Deps
  severity: Warning
  tags: []
  category: Quality
- id: TS_BUNDLE_BLOAT
  target_ext: ts
  observation: Hey, it looks like a heavy library is being imported entirely using
    'import *'.
  impact: Importing entire libraries (like lodash) can significantly bloat Next.js
    client-side bundles.
  improvement: Consider importing just the specific functions you need (e.g., 'import
    { debounce } from lodash').
  on_node: (import_statement) @node
  if_matches: import \* as .* from ['"](lodash|moment)['"]
  name: Ts Bundle Bloat
  severity: Warning
  tags: []
  category: Performance
- id: TS_ASYNC_FOR_EACH
  target_ext: ts
  observation: I noticed a '.forEach' call with an 'async' callback.
  impact: Array.prototype.forEach is not promise-aware. The loop will continue without
    awaiting the callback, leading to race conditions and unhandled rejections.
  improvement: Consider using 'for...of' or 'await Promise.all(arr.map(async ...))'
    for proper concurrency control.
  on_node: call_expression
  if_matches: forEach\(\s*async
  name: Ts Async For Each
  severity: Warning
  tags: []
  category: Reliability
- id: TS_SENSITIVE_DATA_LOGGING
  target_ext: ts
  observation: I noticed a logging call that seems to include sensitive keywords (password,
    token, secret).
  impact: Logging sensitive credentials or PII in production logs is a major security
    violation and can lead to account takeovers.
  improvement: Ensure sensitive data is masked, redacted, or removed entirely from
    logging output.
  on_node: call_expression
  if_matches: (console\.log|logger|tracing).*password|token|secret|cvv|apikey
  name: Ts Sensitive Data Logging
  severity: Warning
  tags: []
  category: Security
- id: TS_DATA_LEAK_TRACKER
  target_ext: ts
  observation: Sensitive data flow into unsafe sink detected via Taint Analysis
  impact: Data flow analysis confirms that sensitive input (e.g. passwords) is reaching
    a logging sink through intermediate variables.
  improvement: Remove the logging of tainted variables or use a secure masking utility.
  on_node: '[ (function_declaration) (method_definition) (arrow_function) ] @node'
  source_pattern: (?i)password|secret|token|key
  sink_pattern: console\.log
  name: Ts Data Leak Tracker
  severity: Warning
  tags: []
  category: Security
- id: TS_FLOATING_PROMISE
  target_ext: ts
  observation: A promise-returning call is made without an 'await'.
  impact: Floating promises can lead to race conditions, unhandled rejections, and non-deterministic behavior.
  improvement: Always await promise-returning calls or explicitly handle them (e.g. .catch()).
  on_node: expression_statement
  if_matches: fetch\(
  must_contain: await
  name: Ts Floating Promise
  severity: Warning
  tags: []
  category: Reliability
