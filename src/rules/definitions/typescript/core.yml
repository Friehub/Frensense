rules:
- id: JS_DYNAMIC_EXECUTION
  target_ext: js
  observation: We observed a pattern of dynamic code execution using 'eval()'.
  impact: Dynamic execution can introduce unpredictability and increase the surface
    area for logic vulnerabilities in isolate environments.
  improvement: Consider using a static mapping or a predefined registry to handle
    dynamic logic securely.
  on_node: call_expression
  if_matches: eval\(
  name: Js Dynamic Execution
  severity: Warning
  tags: []
  category: Security
  confidence: 0.95
  precision: very-high

- id: TS_DYNAMIC_EXECUTION
  target_ext: ts
  observation: We observed a pattern of dynamic code execution using 'eval()'.
  impact: Dynamic execution can introduce unpredictability and increase the surface
    area for logic vulnerabilities in isolate environments.
  improvement: Consider using a static mapping or a predefined registry to handle
    dynamic logic securely.
  on_node: call_expression
  if_matches: eval\(
  name: Ts Dynamic Execution
  severity: Warning
  tags: []
  category: Security
  confidence: 0.95
  precision: very-high

- id: TS_ALIASED_DYNAMIC_EXECUTION
  target_ext: ts
  observation: Aliased dynamic code execution detected.
  impact: Aliasing 'eval' to another variable can be used to bypass static analysis
    and execute arbitrary code dynamically.
  improvement: Avoid dynamic execution. If necessary, ensure strict input sanitization.
  on_node: '[ (function_declaration) (method_definition) (arrow_function) ] @node'
  source_pattern: ^eval$
  sink_pattern: <EXECUTE>
  name: Ts Aliased Dynamic Execution
  severity: Warning
  tags: []
  category: Security
  confidence: 0.90
  precision: very-high

- id: TS_BLOCKING_IO
  target_ext: ts
  observation: We observed a synchronous I/O call within a potentially asynchronous
    execution path.
  impact: Synchronous calls block the event loop, which can significantly reduce the
    responsiveness of the service under load.
  improvement: Consider using the asynchronous version of this call to keep the event
    loop moving smoothly.
  on_node: call_expression
  if_matches: Sync\(
  name: Ts Blocking Io
  severity: Warning
  tags: []
  category: Performance
  confidence: 0.70
  precision: high

- id: TS_EMPTY_CATCH
  target_ext: ts
  observation: Hey, it looks like this catch block is empty.
  impact: Silently swallowing errors makes debugging very difficult and can leave
    the app in a weird state.
  improvement: It's usually best to at least log the error, or re-throw it if you
    can't handle it here.
  on_node: (catch_clause) @node
  must_not_contain: \{\s*\}
  name: Ts Empty Catch
  severity: Warning
  tags: []
  category: Reliability
  confidence: 0.90
  precision: very-high

- id: TS_REACT_HOOK_DEPS
  target_ext: tsx
  observation: I noticed a 'useEffect' hook with an empty dependency array [].
  impact: Empty dependency arrays can cause stale closures if the hook references
    variables from the component scope.
  improvement: Double check that all referenced variables are included in the dependency
    array to ensure the UI stays in sync.
  on_node: call_expression
  if_matches: (?s)useEffect\(.*\s*,\s*\[\s*\]\)
  name: Ts React Hook Deps
  severity: Warning
  tags: []
  category: Quality
  confidence: 0.85
  precision: very-high

- id: TS_BUNDLE_BLOAT
  target_ext: ts
  observation: Hey, it looks like a heavy library is being imported entirely using
    'import *'.
  impact: Importing entire libraries (like lodash) can significantly bloat Next.js
    client-side bundles.
  improvement: Consider importing just the specific functions you need (e.g., 'import
    { debounce } from lodash').
  on_node: (import_statement) @node
  if_matches: import \* as .* from ['"](lodash|moment)['"]
  name: Ts Bundle Bloat
  severity: Warning
  tags: []
  category: Performance
  confidence: 0.85
  precision: very-high

- id: TS_ASYNC_FOR_EACH
  target_ext: ts
  observation: I noticed a '.forEach' call with an 'async' callback.
  impact: Array.prototype.forEach is not promise-aware. The loop will continue without
    awaiting the callback, leading to race conditions and unhandled rejections.
  improvement: Consider using 'for...of' or 'await Promise.all(arr.map(async ...))'
    for proper concurrency control.
  on_node: call_expression
  if_matches: forEach\(\s*async
  name: Ts Async For Each
  severity: Warning
  tags: []
  category: Reliability
  confidence: 0.90
  precision: very-high

- id: TS_SENSITIVE_DATA_LOGGING
  target_ext: ts
  observation: I noticed a logging call that seems to include sensitive keywords (password,
    token, secret).
  impact: Logging sensitive credentials or PII in production logs is a major security
    violation and can lead to account takeovers.
  improvement: Ensure sensitive data is masked, redacted, or removed entirely from
    logging output.
  on_node: call_expression
  if_matches: (console\.log|logger|tracing).*password|token|secret|cvv|apikey
  name: Ts Sensitive Data Logging
  severity: Warning
  tags: []
  category: Security
  confidence: 0.55
  precision: medium

- id: TS_FLOATING_PROMISE
  target_ext: ts
  observation: A promise-returning call is made without an 'await'.
  impact: Floating promises can lead to race conditions, unhandled rejections, and non-deterministic behavior.
  improvement: Always await promise-returning calls or explicitly handle them (e.g. .catch()).
  on_node: expression_statement
  if_matches: fetch\(
  must_contain: await
  name: Ts Floating Promise
  severity: Warning
  tags: []
  category: Reliability
  confidence: 0.85
  precision: very-high

- id: TS_SSRF_VULNERABILITY
  target_ext: ts|js
  observation: 'SSRF Vulnerability: User input flows directly into a network sink.'
  impact: Allows attackers to make arbitrary requests from the backend.
  improvement: Sanitize the input or use an allowlist.
  on_node: '[ (function_declaration) (method_definition) (arrow_function) ] @node'
  source_pattern: (req|request)\.(query|body|params)
  sink_pattern: ^(fetch|axios)$
  name: TS SSRF Vulnerability
  severity: Critical
  tags: [security]
  category: Security
  confidence: 0.90
  precision: very-high

- id: TS_UNAWAITED_TEST_ASSERTION
  target_ext: ts|js|tsx|jsx
  observation: 'Unawaited test assertion detected.'
  impact: The test will silently pass even if the assertion fails.
  improvement: Add `await` before the assertion.
  on_node: expression_statement
  if_matches: expect\(.*(\.resolves|\.rejects)
  must_contain: await
  name: TS Unawaited Test Assertion
  severity: Critical
  tags: [reliability]
  category: Reliability
  confidence: 0.90
  precision: very-high

- id: TS_OBJECT_SPREAD_OVERRIDE_SECURITY
  target_ext: ts|js|tsx|jsx
  on_node: object
  if_matches: '\.\.\..*(isAdmin|role|permissions|scopes|isRoot|isSuperuser|isStaff|isOperator)|(isAdmin|role|permissions|scopes|isRoot|isSuperuser|isStaff|isOperator).*\.\.\.'
  observation: Object spread may override a security-related property.
  impact: If the spread source is user-controlled, the security property (e.g., isAdmin,
    role) can be overwritten, enabling privilege escalation.
  improvement: Validate or sanitize the spread source, or explicitly check the security
    property after the spread.
  name: TS Object Spread Override Security
  severity: Warning
  category: Security
  tags: [security, prototype-pollution, express]
  confidence: 0.65
  precision: high

- id: TS_COOKIE_SECURITY
  target_ext: ts|js|tsx|jsx
  on_node: call_expression
  if_matches: \.cookie\(|cookies\(\)\.set\(|\.setCookie\(
  must_contain: httpOnly|secure|sameSite
  observation: Cookie is set without security flags (httpOnly, secure, sameSite).
  impact: "Cookies without httpOnly are accessible to JavaScript (XSS risk). Cookies without secure are sent over HTTP. Cookies without sameSite are vulnerable to CSRF."
  improvement: "Add httpOnly: true, secure: true, and sameSite: 'strict' to cookie options."
  name: TS Cookie Security
  severity: Warning
  tags: [security, cookies]
  category: Security
  confidence: 0.80
  precision: high

- id: TS_AS_ANY_ESCAPE
  target_ext: ts|tsx
  on_node: as_expression
  if_matches: as\s+any
  observation: "Type assertion 'as any' bypasses the type system entirely."
  impact: "Using 'as any' disables type checking for this value, which can hide real type errors and lead to runtime crashes."
  improvement: "Use a proper type or interface instead of 'as any'. If the type is genuinely unknown, consider 'unknown' with a type guard."
  name: TS As Any Escape
  severity: Warning
  tags: [llm, typescript, type-safety]
  category: Quality
  confidence: 0.90
  precision: very-high

- id: TS_LLM_ANY_PARAMETER
  target_ext: ts|tsx
  on_node: required_parameter
  if_matches: :\s*any\b
  observation: "Function parameter is typed as 'any' — the LLM likely did not know the correct type."
  impact: "Using 'any' for parameters disables type checking for all call sites and can hide type mismatches."
  improvement: "Replace 'any' with a specific type. If the parameter truly accepts any type, consider 'unknown' with runtime validation."
  name: TS LLM Any Parameter
  severity: Warning
  tags: [llm, typescript, type-safety]
  category: Quality
  confidence: 0.75
  precision: medium

- id: TS_LLM_PROMISE_CATCH
  target_ext: ts|js|tsx|jsx
  on_node: expression_statement
  if_matches: \.then\(
  must_contain: \.catch\(
  observation: "Promise chain uses .then() without a .catch() error handler."
  impact: "Unhandled promise rejections crash the process or cause silent failures."
  improvement: "Add .catch() to handle errors, or use async/await with try/catch."
  name: TS LLM Promise Catch
  severity: Warning
  tags: [llm, reliability]
  category: Reliability
  confidence: 0.75
  precision: medium

- id: TS_COMMAND_INJECTION
  target_ext: ts|js|tsx|jsx
  on_node: '[ (function_declaration) (method_definition) (arrow_function) ] @node'
  source_pattern: (req|request)\.(query|body|params)
  sink_pattern: ^(exec|execSync|execFile|execFileSync|spawn|spawnSync|fork)$
  observation: "User-controlled input flows into an OS command execution function."
  impact: "Command injection allows attackers to execute arbitrary commands on the server, leading to full compromise."
  improvement: "Avoid executing shell commands with user input. Use a safe API or validate input against an allowlist."
  name: TS Command Injection
  severity: Critical
  tags: [security, command-injection]
  category: Security
  confidence: 0.85
  precision: very-high

- id: TS_HARDCODED_SECRET
  target_ext: ts|js|tsx|jsx
  on_node: lexical_declaration|assignment_expression|pair
  if_matches: (?i)(api[_-]?key|secret|password|token|private_key|mnemonic).*['"][a-zA-Z0-9_\-]{16,}['"]
  observation: "Potential secret or credential hardcoded in source code."
  impact: "Hardcoding secrets (API keys, passwords, tokens) in source code is a major security risk that can lead to unauthorized access."
  improvement: "Move secrets to environment variables or a secure vault."
  name: TS Hardcoded Secret
  severity: Critical
  tags: [security, secrets]
  category: Security
  confidence: 0.65
  precision: medium

- id: TS_PROTOTYPE_POLLUTION
  target_ext: ts|js|tsx|jsx
  on_node: assignment_expression
  if_matches: __proto__|constructor\.prototype
  observation: "Prototype pollution via __proto__ or constructor.prototype assignment."
  impact: "Prototype pollution can lead to property injection, denial of service, or remote code execution in some runtimes."
  improvement: "Use Object.create(null) for safe objects or Map for key-value storage. Never assign to __proto__."
  name: TS Prototype Pollution
  severity: Warning
  tags: [security, prototype-pollution]
  category: Security
  confidence: 0.90
  precision: very-high

- id: TS_LLM_CONSOLE_LOG
  target_ext: ts|js|tsx|jsx
  on_node: call_expression
  if_matches: console\.(log|debug)\(
  observation: "console.log or console.debug left in code — likely debug logging from an LLM."
  impact: "Debug logging in production can leak sensitive data and clutter observability pipelines."
  improvement: "Remove or replace with a proper logging framework that supports log levels."
  name: TS LLM Console Log
  severity: Warning
  tags: [llm, quality]
  category: Quality
  confidence: 0.65
  precision: medium

- id: TS_LLM_MUTATE_AFTER_RESPONSE
  target_ext: ts|js|tsx|jsx
  on_node: function_declaration|method_definition|arrow_function
  if_matches: \.(send|json|end|status)\b
  temporal:
    sequence: ['\.(send|json|end|redirect|render)$', '\.(write|modify|update|delete|insert|save|set|push)$']
    behavior: must_not_follow
  observation: "Mutation detected after response was sent."
  impact: "Mutating state after sending a response can lead to inconsistent client outcomes and phantom writes if the mutation fails."
  improvement: "Perform all mutations before sending the response."
  name: TS LLM Mutate After Response
  severity: Warning
  tags: [llm, reliability]
  category: Reliability
  confidence: 0.70
  precision: medium

- id: TS_UNHANDLED_ASYNC_REJECTION
  target_ext: ts|js|tsx|jsx
  on_node: function_declaration
  if_matches: async[\s\S]*await
  body_must_contain: try\s*\{|\.catch\(
  observation: "Async function uses await without any error handling."
  impact: "Unhandled promise rejections crash the process or cause silent failures. LLMs often forget to wrap async code in try/catch."
  improvement: "Wrap await calls in try/catch, add .catch() to promises, or handle rejections explicitly."
  name: TS Unhandled Async Rejection
  severity: Warning
  tags: [llm, reliability]
  category: Reliability
  confidence: 0.65
  precision: medium
