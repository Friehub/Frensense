rules:
- id: TS_HARDCODED_ENV_URL
  domain: security
  target_ext: ts
  on_node: (string) @node
  if_matches: https?://(api|prod|staging|dev)\.
  impact: Hardcoded environment URLs prevent infrastructure portability and leak environment
    topology.
  improvement: Move the URL to an environment variable (e.g., process.env.API_URL).
  observation: I found a hardcoded environment URL. This usually indicates configuration
    that should be externalized.
  name: Ts Hardcoded Env Url
  severity: Warning
  tags: []
  category: Security
