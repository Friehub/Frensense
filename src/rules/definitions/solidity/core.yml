rules:
- id: SOL_SELFDESTRUCT_ADVISORY
  target_ext: sol
  observation: 'Just a quick note: ''selfdestruct'' is being used here.'
  impact: Contract destruction is a high-impact event that can sometimes lock funds
    or break integrations for users.
  improvement: A 'Pausable' or 'Deprecated' state pattern might be a safer alternative
    for predictable lifecycle management.
  on_node: (expression_statement) @node
  if_matches: selfdestruct
  name: Sol Selfdestruct Advisory
  severity: Warning
  tags: []
  category: Security
  precision: low
- id: SOL_PRAGMA_STABILITY
  target_ext: sol
  observation: We noticed a floating pragma (e.g., ^0.8.0) in the contract header.
  impact: Floating pragmas can lead to non-deterministic builds if different compiler
    versions are used across environments.
  improvement: We recommend locking the pragma to a specific compiler version for
    consistent, verifiable deployments.
  on_node: (pragma_directive) @node
  if_matches: \^
  name: Sol Pragma Stability
  severity: Warning
  tags: []
  category: Stability
  precision: low
- id: SOL_ACCESS_CONTROL_SETTER
  target_ext: sol
  observation: We observed a state mutation in a function that may be missing access
    control.
  impact: Publicly accessible setters can allow unauthorized users to modify critical
    protocol parameters.
  improvement: Ensure this function is protected by an access control modifier like
    'onlyOwner' or 'onlyRole'.
  on_node: (function_definition) @node
  if_matches: function [a-zA-Z0-9_]+\s*\(.*\)\s*(public|external)
  must_contain: (onlyOwner|onlyRole|onlyOperator|onlyAdmin)
  name: Sol Access Control Setter
  severity: Warning
  tags: []
  category: Security
  precision: low
- id: SOL_ZERO_ADDRESS_CHECK
  target_ext: sol
  observation: We noticed an address assignment that might be missing a zero-address
    check.
  impact: Setting critical parameters to the zero address can accidentally 'brick'
    contract functionality.
  improvement: 'We recommend adding a check: require(_address != address(0), ''ZeroAddress'');'
  on_node: (function_definition) @node
  if_matches: function.*\(.*address .*\)
  must_contain: address\(0\)
  name: Sol Zero Address Check
  severity: Warning
  tags: []
  category: Quality
  precision: low
- id: SOL_MISSING_EVENT_INDEX
  target_ext: sol
  observation: We noticed an event parameter that is not 'indexed'.
  impact: Missing 'indexed' attributes on critical event parameters (like addresses)
    makes it difficult to filter and search for events off-chain.
  improvement: Consider adding the 'indexed' keyword to parameters that are frequently
    used for filtering (e.g., event Transfer(address indexed from, ...)).
  on_node: (event_definition) @node
  must_not_contain: \(address [a-zA-Z0-9_]+\)
  name: Sol Missing Event Index
  severity: Warning
  tags: []
  category: Quality
  precision: low
- id: SOL_HARDCODED_ADDRESS
  target_ext: sol
  observation: We observed a hardcoded hexadecimal address literal.
  impact: Hardcoding addresses (other than the zero address) makes the contract inflexible
    and prone to errors during multi-chain deployment or upgrades.
  improvement: We suggest passing addresses through the constructor or using a Registry/Factory
    pattern for better flexibility.
  on_node: (number_literal) @node
  if_matches: 0x[a-fA-A0-9]{40}
  name: Sol Hardcoded Address
  severity: Warning
  tags: []
  category: Security
  precision: low
- id: SOL_TX_ORIGIN
  target_ext: sol
  observation: We noticed 'tx.origin' being used for authentication.
  impact: Using 'tx.origin' makes the contract vulnerable to phishing-style reentrancy
    attacks. An attacker can trick a user into calling a malicious contract that then
    calls your contract.
  improvement: We recommend using 'msg.sender' for authentication instead.
  on_node: (identifier) @node
  if_matches: tx\.origin
  name: Sol Tx Origin
  severity: Warning
  tags: []
  category: Security
  precision: low
- id: SOL_TIMESTAMP_DEPENDENCY
  target_ext: sol
  observation: I noticed the use of 'block.timestamp' for timing logic.
  impact: Block timestamps can be slightly manipulated by miners, which might be risky
    if relied upon for critical logic like randomness.
  improvement: Consider using an external oracle (like Chainlink) for high-precision
    randomness or coarse timing checks.
  on_node: (identifier) @node
  if_matches: block\.timestamp
  name: Sol Timestamp Dependency
  severity: Warning
  tags: []
  category: Security
  precision: low
- id: SOL_REENTRANCY_RISK
  target_ext: sol
  observation: I noticed an external call that might be missing a reentrancy guard.
  impact: 'External calls (like ''.call{value: ...}'') can trigger fallback functions,
    leading to reentrancy vulnerabilities if not properly protected.'
  improvement: Consider adding a 'nonReentrant' modifier to this function, or ensure
    the Checks-Effects-Interactions pattern is strictly followed.
  on_node: (function_definition) @node
  if_matches: \.call\s*\{
  must_not_contain: nonReentrant
  name: Sol Reentrancy Risk
  severity: Warning
  tags: []
  category: Security
  precision: low
- id: SOL_PRECISION_LOSS
  target_ext: sol
  observation: It looks like a division operation occurs before multiplication here.
  impact: In Solidity, integer division truncates. Dividing before multiplying can
    lead to significant precision loss in financial calculations.
  improvement: A great rule of thumb is to perform all multiplications before divisions
    to preserve precision.
  on_node: (binary_expression) @node
  if_matches: /[^;]*\*
  name: Sol Precision Loss
  severity: Warning
  tags: []
  category: Fintech
  precision: low
