rules:
- id: RUST_UNSAFE_BLOCK
  target_ext: rs
  observation: Hey, I noticed an 'unsafe' block here.
  impact: Unsafe code bypasses Rust's safety guarantees, which can sometimes lead
    to tricky undefined behavior if not audited.
  improvement: Whenever possible, try sticking to safe Rust. If hardware-level interaction
    is needed, ensure it's heavily tested!
  on_node: unsafe_block
  if_matches: unsafe
  name: Rust Unsafe Block
  severity: Warning
  tags: []
  category: Security
  confidence: 0.40
  precision: low
  exclude_scope: 'tests/|tests-build/|#\[(cfg\(test\)|test)\]'

- id: RUST_HOST_INTERACTION
  target_ext: rs
  observation: We observed a direct interaction with host processes using 'std::process'.
  impact: Isolated workers are designed to be environment-agnostic; host interaction
    can break portability and security boundaries.
  improvement: We suggest routing host-level requests through the provided system-call
    interface or an event-based proxy.
  on_node: call_expression
  if_matches: Command::new|std::process
  name: Rust Host Interaction
  severity: Warning
  tags: []
  category: Isolation
  confidence: 0.70
  precision: high
  exclude_scope: 'tests/|tests-build/|#\[(cfg\(test\)|test)\]'

- id: RUST_ALLOCATION_IN_LOG
  target_ext: rs
  observation: We noticed 'format!' being used inside a logging macro.
  impact: This can cause unnecessary allocations even when the specific log level
    is disabled at runtime.
  improvement: 'Try passing arguments directly to the log macro (e.g., info!(''val:
    {}'', v)) to leverage deferred formatting.'
  on_node: macro_invocation
  if_matches: (info!|warn!|error!|debug!|trace!)\(.*format!
  name: Rust Allocation In Log
  severity: Warning
  tags: []
  category: Performance
  confidence: 0.65
  precision: medium
  exclude_scope: 'tests/|tests-build/|#\[(cfg\(test\)|test)\]'

- id: RUST_CLONE_IN_LOOP
  target_ext: rs
  observation: Just a heads-up, there's a '.clone()' call inside this loop.
  impact: Allocating memory repeatedly inside a loop can quietly degrade performance.
  improvement: Consider pulling the clone outside the loop, or maybe use references/Arc
    if you don't strictly need ownership.
  on_node: for_expression
  if_matches: \.clone\(\)
  name: Rust Clone In Loop
  severity: Warning
  tags: []
  category: Performance
  confidence: 0.60
  precision: medium
  exclude_scope: 'tests/|tests-build/|#\[(cfg\(test\)|test)\]'

- id: RUST_SILENT_FAILURE
  target_ext: rs
  observation: We observed a pattern of logging a failure but returning 'Ok(())'.
  impact: Logging a failure without propagating it or changing the system state is
    an anti-pattern that hides errors and breaks expected control flow.
  improvement: Ensure that errors are either returned (Result<T, E>), propagated,
    or lead to an explicit system state transition.
  on_node: macro_invocation
  if_matches: (warn!|error!)\(.*\);\s*Ok\(\(\)\)
  name: Rust Silent Failure
  severity: Warning
  tags: []
  category: Reliability
  confidence: 0.60
  precision: medium
  exclude_scope: 'tests/|tests-build/|#\[(cfg\(test\)|test)\]'

- id: RUST_VEC_FRONT_REMOVE
  target_ext: rs
  observation: We noticed '.remove(0)' being called on a Vec.
  impact: Removing from the front of a Vec requires shifting all subsequent elements,
    resulting in O(n) time complexity. This can cause significant latency in large
    collections.
  improvement: We recommend using 'VecDeque' and '.pop_front()' for O(1) removals
    from the front.
  on_node: call_expression
  if_matches: \.remove\(0\)
  name: Rust Vec Front Remove
  severity: Warning
  tags: []
  category: Performance
  confidence: 0.90
  precision: very-high
  exclude_scope: 'tests/|tests-build/|#\[(cfg\(test\)|test)\]'

- id: RUST_ALGO_N2_LOOP
  target_ext: rs
  observation: We observed a search operation (.contains/.find) inside a loop over
    a collection.
  impact: "This pattern results in O(N\xB2) algorithmic complexity, which can lead\
    \ to exponential performance degradation as data size grows."
  improvement: Consider using a 'HashSet' or 'BTreeSet' for O(1)/O(log n) lookups
    instead.
  on_node: '[ (for_expression) (while_expression) ] @node'
  if_matches: \.(contains|find|position)\(
  name: Rust Algo N2 Loop
  severity: Warning
  tags: []
  category: Performance
  confidence: 0.60
  precision: medium
  exclude_scope: 'tests/|tests-build/|#\[(cfg\(test\)|test)\]'

- id: RUST_CHANNEL_UNBOUNDED
  target_ext: rs
  observation: We observed the creation of an unbounded channel (unbounded_channel).
  impact: Unbounded channels can grow indefinitely if the consumer is slower than
    the producer, leading to Out-Of-Memory (OOM) crashes.
  improvement: We suggest using a bounded channel (e.g., mpsc::channel(capacity))
    to provide backpressure.
  on_node: call_expression
  if_matches: unbounded_channel
  name: Rust Channel Unbounded
  severity: Warning
  tags: []
  category: Concurrency
  confidence: 0.85
  precision: very-high
  exclude_scope: 'tests/|tests-build/|#\[(cfg\(test\)|test)\]'

- id: RUST_UNCHECKED_IO
  target_ext: rs
  observation: I noticed an I/O operation followed directly by an `.unwrap()`.
  impact: I/O operations (like opening files or network requests) are prone to failure.
    Unwrapping them can cause the entire service to panic.
  improvement: Consider handling the Result with `match` or `?` to gracefully log
    or propagate the error.
  on_node: call_expression
  if_matches: (File::open|reqwest::get|TcpStream::connect)[^;]*\.unwrap\(\)
  name: Rust Unchecked Io
  severity: Warning
  tags: []
  category: Reliability
  confidence: 0.65
  precision: medium
  exclude_scope: 'tests/|tests-build/|#\[(cfg\(test\)|test)\]'

- id: RUST_UNWRAP_SAFETY
  target_ext: rs
  observation: I noticed an '.unwrap()' call that doesn't seem to have a '// SAFETY:'
    comment nearby.
  impact: Unwrapping without documented justification is a production risk. If the
    assumption is wrong, the service will panic.
  improvement: Please add a '// SAFETY:' comment above this line explaining why this
    unwrap is guaranteed to succeed.
  on_node: "(call_expression function: (field_expression field: (field_identifier) @fn_name (#eq? @fn_name \"unwrap\"))) @node"
  must_contain: '// SAFETY:'
  name: Rust Unwrap Safety
  severity: Warning
  tags: []
  category: Reliability
  confidence: 0.60
  precision: medium
  exclude_scope: 'tests/|tests-build/|#\[(cfg\(test\)|test)\]'

- id: RUST_TOKIO_SELECT_ELSE
  target_ext: rs
  observation: I noticed a 'tokio::select!' block that might be missing an 'else'
    or 'default' branch.
  impact: Select blocks without a default branch can hang indefinitely if all futures
    are pending or completed.
  improvement: Consider adding an 'else => ...' branch to handle cases where no futures
    are ready.
  on_node: macro_invocation
  if_matches: tokio::select
  must_contain: (else|default)\s*=>
  name: Rust Tokio Select Else
  severity: Warning
  tags: []
  category: Reliability
  confidence: 0.90
  precision: very-high
  exclude_scope: 'tests/|tests-build/|#\[(cfg\(test\)|test)\]'

- id: RUST_LARGE_STACK_ALLOCATION
  target_ext: rs
  on_node: array_expression
  if_matches: \[.*;\s*(\d{5,})\]
  impact: Allocating large buffers (>10KB) on the stack increases the risk of stack
    overflow, especially in async contexts with many concurrent tasks.
  improvement: Move the buffer to the heap using 'Box::new()' or 'Vec::with_capacity()'.
  observation: I noticed a large array allocation on the stack.
  name: Rust Large Stack Allocation
  severity: Warning
  tags: []
  category: Reliability
  confidence: 0.65
  precision: medium
  exclude_scope: 'tests/|tests-build/|#\[(cfg\(test\)|test)\]'

- id: RUST_PANIC_IN_LIB
  target_ext: rs
  on_node: macro_invocation
  if_matches: (panic|todo|unimplemented)!
  impact: Unconditional panics in library or protocol crates cause hard crashes for
    consumers. Standard practice is to return 'Result' and let the caller decide how
    to handle failure.
  improvement: Replace 'panic!' with 'Err(...)' returning a proper error type.
  observation: I found an unconditional panic macro. Library code should generally
    avoid hard crashes.
  name: Rust Panic In Lib
  severity: Warning
  tags: []
  category: Safety
  confidence: 0.65
  precision: medium
  exclude_scope: 'tests/|tests-build/|#\[(cfg\(test\)|test)\]'

- id: SECRET_LEAK_DETECTION
  target_ext: rs
  observation: Potential secret or credential leakage detected in source code.
  impact: Hardcoding secrets (API keys, private keys, etc.) in source code is a major security risk and can lead to unauthorized access.
  improvement: Move the secret to a secure vault or environment variable.
  on_node: let_declaration
  if_matches: (?i)(api_key|secret|password|private_key|mnemonic).*['"][a-zA-Z0-9]{16,}['"]
  name: Secret Leak Detection
  severity: Critical
  tags: []
  category: Security
  confidence: 0.90
  precision: medium

- id: RUST_SPAWN_WITHOUT_JOINHANDLE
  target_ext: rs
  on_node: expression_statement
  if_matches: tokio::spawn\(|thread::spawn\(
  observation: Spawned task handle is immediately dropped — panics will be silently swallowed.
  impact: A panic inside a detached task does not propagate to the spawner. The failure is lost.
  improvement: Assign the JoinHandle and await it, or use a task supervisor like tokio::task::JoinSet.
  severity: Warning
  category: Concurrency
  name: Rust Spawn Without Joinhandle
  tags: []
  confidence: 0.70
  precision: high
  exclude_scope: 'tests/|tests-build/|#\[(cfg\(test\)|test)\]'


- id: RUST_MUTEX_POISONING_UNHANDLED
  target_ext: rs
  on_node: call_expression
  if_matches: \.lock\(\)\s*\.(unwrap|expect)\(
  observation: Mutex::lock().unwrap() propagates poisoned mutex state silently.
  impact: If another thread panicked while holding this lock, this code will also panic with a confusing error.
  improvement: Use .unwrap_or_else(|p| p.into_inner()) to recover from poisoning, or use parking_lot::Mutex which doesn't poison.
  severity: Warning
  category: Concurrency
  name: Rust Mutex Poisoning Unhandled
  tags: []
  confidence: 0.60
  precision: medium
  exclude_scope: 'tests/|tests-build/|#\[(cfg\(test\)|test)\]'

- id: RUST_BLOCKING_IN_ASYNC
  target_ext: rs
  on_node: function_item
  if_matches: async fn
  must_not_contain: tokio::task::spawn_blocking|asyncify
  body_must_contain_any_of: std::fs::|std::net::TcpStream::connect|thread::sleep
  observation: Blocking stdlib call detected inside an async function.
  impact: Blocking calls on async executor threads stall all tasks scheduled on that thread.
  improvement: Use the tokio::fs, tokio::net, or tokio::time equivalents, or wrap in tokio::task::spawn_blocking.
  severity: Critical
  category: Performance
  name: Rust Blocking In Async
  tags: []
  confidence: 0.65
  precision: medium

- id: RUST_SERDE_MISSING_DENY_UNKNOWN
  target_ext: rs
  on_node: struct_item
  if_matches: '#\[derive[^\]]*Deserialize'
  must_contain: deny_unknown_fields
  observation: Struct derives Deserialize but does not use #[serde(deny_unknown_fields)].
  impact: Unknown fields in the payload are silently ignored. Mass-assignment vulnerabilities can arise when the same struct is used across different layers.
  improvement: Add #[serde(deny_unknown_fields)] to structs that represent API input or sensitive domain objects.
  severity: Warning
  category: Security
  tags: [security, serde, api]
  name: Rust Serde Missing Deny Unknown
  confidence: 0.65
  precision: medium

- id: RUST_LOCK_SLEEP
  target_ext: rs
  on_node: function_item
  if_matches: \block\b
  temporal:
    sequence: ["^lock$", "^sleep$"]
    behavior: must_not_follow
  observation: Holding a lock while calling thread::sleep() can cause deadlocks and
    convoying.
  impact: A sleeping thread holding a mutex prevents all other threads from acquiring
    the lock, leading to severe contention or deadlock.
  improvement: Release the lock guard before calling blocking operations or use
    async-aware synchronization primitives.
  name: Lock Held During Sleep
  severity: Warning
  category: Concurrency
  tags: [concurrency, deadlock, mutex]
  confidence: 0.85
  precision: high
  exclude_scope: 'tests/|tests-build/|#\[(cfg\(test\)|test)\]'

- id: RUST_CONNECTION_LEAK
  target_ext: rs
  on_node: function_item
  if_matches: \b(get_connection|pool\.get|(?:pool|conn|client|manager)\.acquire)\b
  temporal:
    sequence: ["^(get_connection|pool\\.get|acquire|connect)$", "^(close|release|drop)$"]
    behavior: must_follow
  observation: A connection or resource is acquired but not released in this scope.
  impact: Unreleased connections can lead to resource exhaustion and connection pool starvation.
  improvement: Ensure every acquire/get_connection is paired with a close/release/drop, typically via a scope guard or explicit cleanup.
  name: Connection Leak
  severity: Warning
  category: Reliability
  tags: [concurrency, resources]
  confidence: 0.65
  precision: medium
  exclude_scope: 'tests/|tests-build/|#\[(cfg\(test\)|test)\]'

- id: RUST_NETWORK_IN_TXN
  target_ext: rs
  on_node: function_item
  if_matches: \b(begin_transaction|tx\.begin)\b
  temporal:
    sequence:
      - "^begin_transaction$"
      - "^(commit|rollback)$"
      - '^(fetch|reqwest|reqwest::get|http|req\.get|req\.post|req\.put|req\.delete|client\.(get|post|put|delete))$'
    behavior: forbidden_between
  observation: Network I/O detected inside a database transaction.
  impact: Network calls inside a transaction can hold the transaction open for long periods, causing connection pool exhaustion and database deadlocks.
  improvement: Move the network call outside the transaction boundary, or restructure to use a separate connection.
  name: Network I/O Inside Transaction
  severity: Warning
  category: Performance
  tags: [database, concurrency, transaction]
  confidence: 0.65
  precision: medium
  exclude_scope: 'tests/|tests-build/|#\[(cfg\(test\)|test)\]'

- id: RUST_MUTATE_AFTER_RESPONSE
  target_ext: rs
  on_node: function_item
  if_matches: \b(send_response|reply|commit_response)\b
  temporal:
    sequence: ["^(send_response|reply|commit_response)$", "^(write|modify|update|delete|insert|save)$"]
    behavior: must_not_follow
  observation: Mutation detected after response was sent.
  impact: Mutating state after sending a response can lead to inconsistent client outcomes and phantom writes if the mutation fails.
  improvement: Perform all mutations before sending the response, or use a two-phase commit pattern.
  name: Mutation After Response
  severity: Warning
  category: Reliability
  tags: [concurrency, state]
  confidence: 0.75
  precision: high
  exclude_scope: 'tests/|tests-build/|#\[(cfg\(test\)|test)\]'

- id: RUST_LLM_CLONE_LITERAL
  target_ext: rs
  on_node: call_expression
  if_matches: \d+\.clone\(\)|true\.clone\(\)|false\.clone\(\)|'[^']*'\.clone\(\)|"[^"]*"\.clone\(\)
  observation: "Clone called on a literal value — the type likely implements Copy and clone() is unnecessary."
  impact: "Cloning primitive values is redundant and wastes CPU cycles. LLMs often add unnecessary .clone() to work around borrow checker confusion."
  improvement: "Remove the .clone() call — literals with Copy semantics are implicitly copied."
  name: Rust LLM Clone Literal
  severity: Warning
  tags: [llm, performance]
  category: Performance
  confidence: 0.60
  precision: medium

- id: RUST_LLM_AWAIT_IN_SYNC
  target_ext: rs
  on_node: function_item
  if_matches: \w+\.await\b
  must_contain: async
  observation: "Use of .await inside a non-async function."
  impact: "The .await keyword is only valid inside async functions. This code will not compile."
  improvement: "Add the 'async' keyword before 'fn', or remove the .await if the call is synchronous."
  name: Rust LLM Await In Sync
  severity: Critical
  tags: [llm, compilation]
  category: Reliability
  confidence: 0.60
  precision: medium

- id: RUST_TRANSMUTE
  target_ext: rs
  on_node: call_expression
  if_matches: \btransmute\b
  observation: "Use of std::mem::transmute detected — it bypasses Rust's type safety guarantees."
  impact: "transmute can create invalid type states, cause undefined behavior, or violate assumed invariants. LLMs often use it as a quick fix for type mismatches."
  improvement: "Prefer safe conversions using From/TryFrom, or use safe casting methods like as, cast(), or bytemuck."
  name: Rust Transmute
  severity: Warning
  tags: [llm, safety]
  category: Safety
  confidence: 0.90
  precision: very-high

- id: RUST_LLM_NEVER_ERR
  target_ext: rs
  on_node: function_item
  if_matches: ->\s*Result<|->\s*Option<
  body_must_contain: \?|return\s+(Err|None)|Err\(|\bNone\b
  must_not_contain: ^\s*(Ok|Some)\(
  observation: "Function returns Result or Option but the body never produces an error or None."
  impact: "The function signature promises fallibility but always succeeds, misleading callers. LLMs often write 'fn foo() -> Result<T>' without any Err path."
  improvement: "Either change the return type, or add proper error handling with ? / Err(...) / None."
  name: Rust LLM Never Err
  severity: Warning
  tags: [llm, reliability]
  category: Reliability
  confidence: 0.50
  precision: low

- id: RUST_MISSING_AWAIT
  target_ext: rs
  on_node: expression_statement
  if_matches: tokio::time::sleep\(
  must_contain: \.await
  observation: "tokio::time::sleep() or sleep() called without .await."
  impact: "Calling an async function without .await only creates a Future but doesn't execute it. The sleep will not actually pause execution."
  improvement: "Add .await: tokio::time::sleep(dur).await;"
  name: Rust Missing Await
  severity: Critical
  tags: [llm, reliability]
  category: Reliability
  confidence: 0.85
  precision: very-high

- id: RUST_DISCARDED_RESULT
  target_ext: rs
  on_node: expression_statement
  if_matches: \.ok\(\)|\.unwrap_or_default\(
  observation: "Result or Option value is discarded via .ok() or .unwrap_or_default()."
  impact: "Silently discarding errors with .ok() or .unwrap_or_default() instead of propagating them can mask real failures and lead to silent data corruption."
  improvement: "Use ? to propagate the error, match on the Result, or handle both Ok and Err explicitly."
  name: Rust Discarded Result
  severity: Warning
  tags: [llm, reliability]
  category: Reliability
  confidence: 0.60
  precision: medium

