rules:
- id: JUMIA_GOD_SERVICE
  target_ext: ts
  on_node: (program) @node
  max_lines: 300
  observation: 'God File Detected: This source file exceeds the 300-line modularity threshold.'
  impact: 'Oversized services often contain mixed concerns, making them harder to test and maintain.'
  improvement: Decompose the service into smaller, specialized modules (e.g., split Query and Command logic).
  name: Jumia God Service
  severity: Warning
  category: Architecture
  precision: low
  tags: [maintainability, architecture]

- id: JUMIA_REPETITIVE_DECIMAL_LOGIC
  target_ext: ts
  on_node: (call_expression) @node
  if_matches: \.toNumber\(\)|\.toFixed\(2\)|Decimal\.ROUND_HALF_UP
  observation: 'Localized Financial Logic: Direct manipulation of Decimal objects detected outside of utility functions.'
  impact: 'Scattered financial rounding/formatting logic can lead to inconsistent precision across the platform.'
  improvement: Centralize this logic in a shared finance-utils.ts to ensure consistent rounding standards.
  name: Jumia Repetitive Finance Logic
  severity: Info
  category: Quality
  precision: low
  tags: [quality, refactor]

- id: JUMIA_STUB_FALLBACK
  target_ext: ts
  on_node: (catch_clause) @node
  if_matches: RustClient|fallback|fallback to Prisma
  observation: 'Production Guard: Found a fallback path for a Rust microservice.'
  impact: 'While good for resilience, heavy reliance on fallback paths indicates the system is not running in its optimal high-performance mode.'
  improvement: Ensure the corresponding Rust sidecar is deployed and stable for 0.2 Beta production.
  name: Jumia Rust Fallback
  severity: Info
  category: Reliability
  precision: low
  tags: [production, reliability]

- id: JUMIA_NESTING_LIMIT
  target_ext: ts
  on_node: "[ (function_declaration) (method_definition) (arrow_function) ] @node"
  max_depth: 3
  observation: "Deep Nesting: logical depth exceeds Jumia-clone limit (3 levels)."
  impact: "Deeply nested code is hard to read and often hide complex edge cases."
  improvement: Flatten the logic using early returns or extract inner blocks into helper methods.
  name: Jumia Nesting Limit
  severity: Warning
  category: Quality
  precision: low
  tags: [quality, readability]

- id: JUMIA_ASYNC_FOR_EACH
  target_ext: ts
  on_node: (call_expression) @node
  if_matches: forEach\(\s*async
  observation: "Async in forEach: Promise-unaware loop detected."
  impact: "Array.forEach does not await promises. This leads to race conditions and unhandled rejections in production."
  improvement: Use 'for...of' or 'Promise.all(arr.map(async ...))' for reliable async iteration.
  name: Jumia Async ForEach
  severity: Critical
  category: Reliability
  precision: low
  tags: [reliability, concurrency]

