rules:
- id: TS_PRISMA_SELECT_STAR
  target_ext: ts
  on_node: (call_expression) @node
  if_matches: \.(findMany|findUnique|findFirst)\(.*\)
  must_not_contain: '(select|include):'
  impact: Fetching entire database rows (SELECT *) increases network overhead and
    can leak sensitive fields (e.g. password_hash).
  improvement: Add an explicit 'select' or 'include' block to fetch only the required
    fields.
  observation: I noticed a Prisma query that fetches all fields. This is inefficient
    for production workloads.
  fix_pattern: '\.(findMany|findUnique|findFirst)\(\s*\)'
  fix_with: '.$1({ select: { id: true /* TODO: Select fields to reduce bloat */ } })'
  name: Ts Prisma Select Star
  severity: Warning
  tags: []
  category: Performance
