rules:
- id: RUST_GOD_FUNCTION
  target_ext: rs
  on_node: (function_item) @node
  max_lines: 100
  observation: 'God Function: block length exceeds standardized threshold (100 lines).'
  impact: 'Standardized Standard #2: Oversized functions indicate mixed concerns and
    low readability.'
  improvement: Decompose logic into smaller, testable units or helper functions.
  name: Rust God Function
  severity: Warning
  tags: []
  category: Quality
- id: RUST_NESTING_LIMIT
  target_ext: rs
  on_node: (function_item) @node
  max_depth: 4
  observation: 'Deep Nesting: logical depth exceeds standardized limit (4 levels).'
  impact: 'Rule #vibecoding: Extreme indentation indicates complex, unmaintainable
    logic.'
  improvement: Extract inner logic into helper functions to flatten the code.
  name: Rust Nesting Limit
  severity: Warning
  tags: []
  category: Quality
- id: TS_GOD_FUNCTION
  target_ext: ts
  on_node: '[ (function_declaration) (method_definition) (arrow_function) ] @node'
  max_lines: 100
  observation: 'God Function: block length exceeds standardized threshold (100 lines).'
  impact: 'Standardized Standard #2: Oversized functions indicate mixed concerns.'
  improvement: Decompose logic into smaller, testable units.
  name: Ts God Function
  severity: Warning
  tags: []
  category: Quality
- id: TS_NESTING_LIMIT
  target_ext: ts
  on_node: '[ (function_declaration) (method_definition) (arrow_function) ] @node'
  max_depth: 4
  observation: 'Deep Nesting: logical depth exceeds standardized limit (4 levels).'
  impact: 'Rule #vibecoding: Extreme indentation indicates complex logic.'
  improvement: Extract inner logic into helper functions.
  name: Ts Nesting Limit
  severity: Warning
  tags: []
  category: Quality
