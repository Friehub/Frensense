[package]
name = "gensense-engine"
version = "0.4.0"
authors = ["Friehub Developers"]
edition = "2024"
description = "GenSense engine core — structural code analysis primitives (fingerprints, profiles, semantic graph, taint, temporal events)"
license = "MIT"
repository = "https://github.com/Friehub/gensense"
rust-version = "1.88"

[lib]
name = "gensense_engine"

[dependencies]
tree-sitter = "0.23"
tree-sitter-rust = { version = "0.23", optional = true }
tree-sitter-typescript = { version = "0.23", optional = true }
tree-sitter-javascript = { version = "0.23", optional = true }
rustc-hash = "1.1"
petgraph = "0.6"
thiserror = "1.0"
regex = "1"
serde = { version = "1.0", features = ["derive"], optional = true }
serde_json = { version = "1.0", optional = true }

[features]
default = ["rust", "typescript"]
rust = ["dep:tree-sitter-rust"]
typescript = ["dep:tree-sitter-typescript", "dep:tree-sitter-javascript"]
serialize = ["dep:serde", "dep:serde_json"]
