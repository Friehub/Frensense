[workspace]
members = ["frensense-bundler","frensense-engine", "frensense-lang", "genesense-wrapper"]
resolver = "2"

[package]
name = "frensense"
version = "0.7.0"
authors = ["Friehub Developers"]
edition = "2024"
description = "Frensense: deterministic dataflow security scanner."
repository = "https://github.com/Friehub/frensense"
homepage = "https://friehub.github.io/frensense/"
license = "GPL-3.0-only"
categories = ["development-tools", "security"]
keywords = ["static-analysis", "security", "dataflow", "taint-analysis"]
publish = true
rust-version = "1.95"

[lib]
name = "frensense"

[[bin]]
name = "frensense"
path = "src/bin/frensense.rs"

[[bin]]
name = "frensense-mcp"
path = "src/bin/frensense-mcp.rs"

[dependencies]
frensense-engine = { path = "frensense-engine", version = "0.7.0", features = ["serialize"] }
frensense-lang = { path = "frensense-lang", version = "0.7.0" }
thiserror = "1.0"
tracing = { version = "0.1", features = ["attributes"] }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
walkdir = "2"
rustc-hash = "1.1"

frensense-bundler = { version = "0.7.0", path = "frensense-bundler" }

[dev-dependencies]
tempfile = "3"
