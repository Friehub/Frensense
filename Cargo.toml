[package]
name = "gensense"
version = "0.3.0"
authors = ["Friehub Developers"]
edition = "2024"
description = "GenSense: High-performance semantic diagnostic engine for Rust, TypeScript, and Solidity."
repository = "https://github.com/Friehub/gensense"
homepage = "https://friehub.github.io/gensense/"
documentation = "https://friehub.github.io/gensense/"
license = "MIT"
categories = ["development-tools::static-analysis", "security"]
keywords = ["static-analysis", "linter", "security", "code-quality"]
publish = true
rust-version = "1.88"
autobins = false

[lib]
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "gensense"
path = "src/bin/gensense.rs"
required-features = ["cli"]

[[bin]]
name = "gensense-mcp"
path = "src/bin/gensense-mcp.rs"
required-features = ["mcp"]

[dependencies]
tree-sitter = "0.23"
tree-sitter-rust = { version = "0.23", optional = true }
tree-sitter-typescript = { version = "0.23", optional = true }
tree-sitter-solidity = { version = "1.2", optional = true }
tree-sitter-yaml = "0.7"
tree-sitter-javascript = { version = "0.23", optional = true }
thiserror = "1.0"
tracing = { version = "0.1", features = ["attributes"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
regex = "1"
walkdir = "2"
diff = { version = "0.1", optional = true }
include_dir = { version = "0.7", features = ["glob"] }
glob = "0.3"
napi = { version = "2.12", default-features = false, features = ["napi4"], optional = true }
napi-derive = { version = "2.12", optional = true }
petgraph = "0.6"
dirs = "5.0"
pathdiff = "0.2"
rustc-hash = "1.1"

[features]
default = ["rust", "typescript", "fingerprinting", "remediation"]
rust = ["dep:tree-sitter-rust"]
typescript = ["dep:tree-sitter-typescript", "dep:tree-sitter-javascript"]
solidity = ["dep:tree-sitter-solidity"]
fingerprinting = []
remediation = ["dep:diff"]
node = ["dep:napi", "dep:napi-derive"]
cli = ["rust", "typescript", "remediation"]
mcp = []
full = ["rust", "typescript", "solidity", "fingerprinting", "remediation", "cli", "mcp"]

[build-dependencies]
napi-build = "2.0"

[dev-dependencies]
tempfile = "3"
criterion = "0.5"

[[bench]]
name = "engine_perf"
path = "tests/benchmarks/engine_perf.rs"
harness = false
