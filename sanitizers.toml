# Frensense Built-in Sanitizers
# Functions that clear taint when called on a tainted value.
# The return value of these functions is considered clean.

[[sanitizers]]
language = "rust"
functions = [
    "validate", "sanitize", "escape", "encode", "encode_uri",
    "hash", "bcrypt", "argon2", "hmac", "sha256", "sha512",
    "from_str", "parse", "try_from", "try_into",
    "html_escape", "url_encode", "percent_encode",
]

[[sanitizers]]
language = "typescript"
functions = [
    "escape", "sanitize", "encode", "encodeURI", "encodeURIComponent",
    "validate", "parse", "parseInt", "parseFloat",
    "z.parse", "zod.parse", "joi.validate",
    "DOMPurify.sanitize", "xss",
]

[[sanitizers]]
language = "python"
functions = [
    "escape", "sanitize", "validate", "parse",
    "model_validate", "BaseModel.parse_obj", "BaseModel.model_validate",
    "html.escape", "urllib.parse.quote",
]
