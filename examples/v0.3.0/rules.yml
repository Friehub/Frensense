# GenSense v0.3.0 Rule Format Examples
#
# v0.3.0 introduces four major capabilities on top of v0.2.2:
#
#   1. Auto-Remediation (fix_pattern + fix_with)
#      The engine can rewrite matched code in-place using the `--fix` flag.
#
#   2. Import Injection (inject_import)
#      When a call-site is rewritten, a new import statement is automatically
#      inserted after the last existing import in the file.
#
#   3. Project-Level CSA Rules (project_rules + must_have_guard)
#      Rules that reason across multiple files. Instead of checking a single
#      AST node, these verify that a function calling a "source" pattern also
#      has a "guard" reachable somewhere in the call graph.
#
#   4. Symbol-Relative Identity (SRI)
#      Every finding is now anchored to its enclosing symbol (function/class)
#      rather than an absolute line number. This makes baselines stable across
#      refactors. Use `--emit-baseline` and `--compare-baseline` in CI.
#
# All v0.2.2 fields remain fully supported. v0.3.0 adds:
#
#   fix_pattern:   Regex with named capture groups ((?P<name>...)) applied to the matched node.
#   fix_with:      Replacement template. Use ${name} to reference capture groups.
#   inject_import: Import statement to inject when a fix is applied. Use {{root}} as a
#                  placeholder for the project root; GenSense resolves it to a relative path.
#
# Project-level rule schema (use 'project_rules' key instead of 'rules'):
#
#   project_rules:
#     - id:                   (required)
#       name:                 (required)
#       ...standard fields...
#       must_have_guard:
#         source_pattern:     Regex matching the "dangerous" call that needs a guard.
#         guard_pattern:      Regex matching the "guard" function that must be reachable.
#         source_file_glob:   Glob restricting which files are scanned for the source.
#         guard_file_glob:    Glob restricting which files are scanned for the guard.

# ═══════════════════════════════════════════════════════════════════════════════
# SECTION 1: File-Level Rules With Auto-Remediation
# ═══════════════════════════════════════════════════════════════════════════════

rules:

  # ─── Example 1: Call-Site Replacement (no import needed) ───────────────────
  # Replaces direct Prisma access with a service-layer call.
  # fix_pattern uses a named capture group (?P<entity>) to extract the
  # model name and reuse it in fix_with.
  #
  # Before:  prisma.cart.delete({ where: { id } })
  # After:   cartService.delete({ where: { id } })
  - id: MY_NO_DIRECT_DB
    name: No Direct Database Access
    target_ext: ts
    on_node: member_expression
    if_matches: "^prisma\\."
    fix_pattern: 'prisma\.(?P<entity>\w+)'
    fix_with: '${entity}Service'
    severity: Warning
    category: Architecture
    observation: >
      Direct database access via 'prisma' was detected outside of a service module.
    impact: >
      Coupling route handlers to the database layer violates the Single Responsibility
      Principle and makes the code difficult to test and audit.
    improvement: >
      Replace this call with the appropriate service function. Add the import manually
      or use '--fix' to apply the call-site substitution automatically.
    tags: [architecture, database]

  # ─── Example 2: Replacement + Import Injection ─────────────────────────────
  # Replaces console.log with a structured logger call AND injects the import.
  # inject_import uses {{root}} which GenSense resolves to a relative path from
  # the file being patched to the project root.
  #
  # Before:  console.log('user created', userId)
  # After:   logger.info('user created', userId)
  #          + import { logger } from '../../shared/logger';  (injected)
  - id: MY_REPLACE_CONSOLE_LOG
    name: Replace console.log With Structured Logger
    target_ext: ts
    on_node: call_expression
    if_matches: console\.log\(
    fix_pattern: 'console\.log\('
    fix_with: 'logger.info('
    inject_import: "import { logger } from '{{root}}/packages/shared/src/logger';"
    severity: Warning
    category: Quality
    observation: >
      A 'console.log' call was detected. This is a direct output to stdout
      without structured metadata.
    impact: >
      Unstructured logs are difficult to correlate in production observability
      pipelines (Datadog, Loki, CloudWatch).
    improvement: >
      Use the shared structured logger (Pino/Winston) for all production output.
      Run '--fix' to replace call sites automatically.
    tags: [quality, observability]

  # ─── Example 3: Regex Rewrite (fix_with template) ──────────────────────────
  # Rewrites empty Prisma queries to include a select scaffold.
  # The TODO comment acts as a guide for the developer to fill in real fields.
  #
  # Before:  prisma.user.findMany()
  # After:   prisma.user.findMany({ select: { id: true /* TODO */ } })
  - id: MY_PRISMA_SELECT_STAR
    name: Prisma Query Without Explicit Select
    target_ext: ts
    on_node: (call_expression) @node
    if_matches: \.(findMany|findUnique|findFirst)\(.*\)
    must_not_contain: '(select|include):'
    fix_pattern: '\.(findMany|findUnique|findFirst)\(\s*\)'
    fix_with: '.$1({ select: { id: true /* TODO: list required fields */ } })'
    severity: Warning
    category: Performance
    observation: >
      A Prisma query was found that fetches all columns (SELECT *).
    impact: >
      Fetching all columns increases payload size and can expose sensitive fields
      such as password hashes or internal audit metadata.
    improvement: >
      Add an explicit 'select' block. Run '--fix' to inject a placeholder scaffold.
    tags: [performance, database]


# ═══════════════════════════════════════════════════════════════════════════════
# SECTION 2: Project-Level CSA Rules (Cross-File Guard Verification)
# ═══════════════════════════════════════════════════════════════════════════════
#
# These rules use 'project_rules' instead of 'rules'. They do NOT target a
# single AST node — they verify that a function calling a "source" operation
# also has a "guard" reachable somewhere in the same or adjacent file.
#
# Use case: Ensure that any route that touches a sensitive operation (e.g.,
# deleting a user, placing an order) also calls an authorization check.

project_rules:

  # ─── Example 4: Guard Verification (must_have_guard) ───────────────────────
  # Fires if a function containing 'delete_user' or 'delete_product' does not
  # have a call to 'validateSession' reachable within the same file glob.
  - id: MY_AUTH_GUARD
    name: Sensitive Operation Without Auth Guard
    target_ext: ts
    severity: Critical
    category: Security
    observation: >
      A sensitive delete operation was found without a reachable 'validateSession' guard.
    impact: >
      Unauthenticated users could trigger destructive operations if the guard is
      missing or bypassed.
    improvement: >
      Ensure 'validateSession' is called before any delete operation in route handlers.
    tags: [security, governance]
    must_have_guard:
      source_pattern:   'delete_user|delete_product|deleteUser|deleteProduct'
      guard_pattern:    'validateSession|requireAuth|authenticate'
      source_file_glob: '**/routes/**/*.ts'
      guard_file_glob:  '**/routes/**/*.ts'

  # ─── Example 5: CSA Validator Pattern ──────────────────────────────────────
  # Fires if a function whose name starts with 'validate', 'verify', or 'check'
  # does not contain a rejection path (return false, throw, Error).
  # This catches validators that always succeed — a common AI-generated bug.
  - id: MY_VALIDATOR_NO_REJECTION
    name: Validator With No Rejection Path
    target_ext: ts
    on_node: "function_declaration|method_definition"
    if_name_matches: "^(validate|verify|check)"
    body_must_contain: 'return\s+(false|null|undefined)|throw|Error'
    severity: Critical
    category: Architecture
    observation: >
      This validator function appears to have no rejection path.
    impact: >
      A validator that always succeeds allows invalid or malicious data to propagate
      through the system unchecked.
    improvement: >
      Ensure the function returns false or throws an error for invalid input.
    tags: [csa, security, ai-risk]

  # ─── Example 6: Inventory Guard Verification ───────────────────────────────
  # Ensures that any function calling a stock reservation or confirmation API
  # also validates an internal service token first.
  # This is the pattern that caught the Jumia inventory handler vulnerability.
  - id: MY_UNPROTECTED_INVENTORY_OP
    name: Inventory Operation Without Internal Token Validation
    target_ext: rs
    severity: Critical
    category: Security
    observation: >
      An inventory write operation was found without a reachable token validation guard.
    impact: >
      Unauthenticated external requests could manipulate stock levels, enabling
      inventory fraud or denial-of-service via stock exhaustion.
    improvement: >
      Call 'validate_internal_token' before 'reserve_stock' or 'confirm_reservation'.
    tags: [security, inventory]
    must_have_guard:
      source_pattern:   'reserve_stock|confirm_reservation'
      guard_pattern:    'validate_internal_token|verify_hmac'
      source_file_glob: '**/inventory/**/*.rs'
      guard_file_glob:  '**/inventory/**/*.rs'
