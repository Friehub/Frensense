# Temporal Rules for Frensense
# Each rule defines a temporal constraint on API call ordering.
# Format: sequence of before/after patterns with behavior type.

[[rules]]
id = "lock_unlock"
sequence = ["lock", "unlock"]
behavior = "must_follow"
severity = "error"
observation = "Every lock() must be followed by unlock()."
impact = "The mutex is never unlocked, causing all subsequent lock attempts to deadlock."
improvement = "Add an explicit unlock() call, or use a RAII guard that drops at scope exit."

[[rules]]
id = "acquire_release"
sequence = ["acquire", "release"]
behavior = "must_follow"
severity = "error"
observation = "Every acquire() must be followed by release()."
impact = "Resource leak: acquired resource is never released."
improvement = "Add an explicit release() call, or use a RAII wrapper."

[[rules]]
id = "open_close"
sequence = ["open", "close"]
behavior = "must_follow"
severity = "warning"
observation = "Every open() must be followed by close()."
impact = "The resource remains open until the runtime drops it, which may be delayed."
improvement = "Use a RAII wrapper or explicit close() call before all return paths."

[[rules]]
id = "connect_disconnect"
sequence = ["connect", "disconnect"]
behavior = "must_follow"
severity = "warning"
observation = "Every connect() must be followed by disconnect()."
impact = "Connection leak: connection is never closed."
improvement = "Use a RAII wrapper or explicit disconnect() call."

[[rules]]
id = "RUST_LOCK_SLEEP"
sequence = ["lock", "sleep"]
behavior = "must_not_follow"
severity = "error"
observation = "Holding a lock while sleeping may cause deadlock."
impact = "Other threads waiting on the lock will be blocked during sleep."
improvement = "Release the lock before sleeping, or use a timeout-based lock."
