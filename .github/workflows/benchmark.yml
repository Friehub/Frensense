name: Vulnerability Benchmark

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  benchmark:
    name: Run Vulnerability Recall Benchmark
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.16.1
        with:
          egress-policy: audit

      - name: Checkout Frensense
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v4.3.0

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # stable
      - name: Setup Rust Cache
        uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2.8.1

      - name: Build Frensense
        run: cargo build --release

      - name: Checkout OWASP Juice Shop
        run: git clone https://github.com/juice-shop/juice-shop.git /tmp/juice-shop

      - name: Run Historical Benchmark
        run: |
          ./scripts/historical-benchmark.sh /tmp/juice-shop routes/ --last 10
          
          # Convert CSV to github-action-benchmark custom JSON format
          python3 -c "
          import csv, json, sys, glob
          csv_files = glob.glob('historical-scan-juice-shop-*.csv')
          if not csv_files:
              print('No CSV file found!')
              sys.exit(1)
          
          data = []
          with open(csv_files[0]) as f:
              reader = csv.DictReader(f)
              for row in reader:
                  data.append({
                      'name': f\"Juice Shop {row['tag']}\",
                      'value': int(row['advisories']),
                      'unit': 'advisories'
                  })
          
          with open('benchmark-results.json', 'w') as f:
              json.dump(data, f, indent=2)
          "
          
          cat benchmark-results.json

      - name: Store and Publish Benchmark Results
        uses: benchmark-action/github-action-benchmark@fd31771ce86cc65eab85653da103f71ab1b4479c # v1.9.0
        with:
          tool: 'customBiggerIsBetter'
          output-file-path: benchmark-results.json
          github-token: ${{ secrets.GITHUB_TOKEN }}
          auto-push: true
          # Alert if our vulnerability recall drops by more than 5%
          alert-threshold: '105%'
          comment-on-alert: true
          fail-on-alert: true
