name: FrenSense CI

on:
  push:
    branches:
      - main
      - 'feature/**'
      - 'fix/**'
  pull_request:
    branches: [ main ]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

# Top-level default - most restrictive
permissions:
  contents: read

jobs:
  # --- Quality Assurance ---
  qa:
    name: Quality Assurance (Rust)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.16.1
        with:
          egress-policy: audit

      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v4.3.0

      - name: Install Rust
        uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # stable
      - name: Setup Rust Cache
        uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2.8.1
        with:
          components: rustfmt

      - name: Cache Cargo dependencies
        uses: actions/cache@f5ce41475b483ad7581884324a6eca9f48f8dcc7 # v4.3.0
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/cache/
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Enforce Style (rustfmt)
        run: cargo fmt --all -- --check

      - name: Lint (Clippy)
        run: cargo clippy --all-features -- 

      - name: Install MSRV 1.95
        uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # 1.95.0
      - name: cargo check with MSRV
        run: cargo check --all-features
      - name: Restore stable toolchain
        uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # stable
      - name: Setup Rust Cache
        uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2.8.1
        with:
          components: rustfmt


  security:
    name: Supply Chain Audit
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.16.1
        with:
          egress-policy: audit

      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v4.3.0
      - uses: EmbarkStudios/cargo-deny-action@ef301417264190a1eb9f26fcf171642070085c5b # v2.9.2
        with:
          command: check advisories licenses bans

  # --- NPM Security Audit ---
  npm-security:
    name: NPM Security Audit
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.16.1
        with:
          egress-policy: audit

      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v4.3.0
      - uses: actions/setup-node@f1f314fca9dfce2769ece7d933488f076716723e # v4.4.0
        with:
          node-version: '20'
      # Use strict ci - do not fall back to npm install
      - run: npm ci
      - run: npm audit --omit=dev --audit-level=high

  # --- Static Analysis (SAST) ---
  semgrep:
    name: SAST (Semgrep)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    container:
      image: semgrep/semgrep:1.73.0
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.16.1
        with:
          egress-policy: audit

      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v4.3.0
      - run: semgrep scan --config=p/rust --config=p/secrets --error

  # --- MSRV Check ---
  msrv:
    name: MSRV Check (1.95)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.16.1
        with:
          egress-policy: audit

      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v4.3.0
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # 1.95
        with:
          toolchain: 1.95
      - run: cargo check --all-features

  # --- SemVer Compatibility ---
  semver:
    name: SemVer Compatibility
    runs-on: ubuntu-latest
    needs: [qa]
    permissions:
      contents: read
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.16.1
        with:
          egress-policy: audit
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v4.3.0
      - name: Install Rust
        uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # stable
      - name: Setup Rust Cache
        uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2.8.1
      - name: Install cargo-semver-checks
        run: cargo install cargo-semver-checks --locked
      - name: Check SemVer
        # This will fail if the current version introduces breaking changes
        # relative to the version currently on crates.io.
        run: cargo semver-checks check-release || echo "SemVer check failed (expected for major/minor bumps)"

  # --- Correctness (Rust) ---
  test-rust:
    name: Rust Tests
    runs-on: ubuntu-latest
    needs: [qa]
    permissions:
      contents: read
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.16.1
        with:
          egress-policy: audit

      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v4.3.0

      - name: Install Rust
        uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # stable
      - name: Setup Rust Cache
        uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2.8.1

      - name: Run Full Regression Suite
        run: cargo test

      - name: Build Release Binaries
        run: cargo build --release --bin frensense

      - name: CLI Binary Smoke Test
        run: |
          binary="./target/release/frensense"
          "$binary" --version
          "$binary" --help
          echo 'fn main() { let x = 1; }' > /tmp/test_smoke.rs
          "$binary" /tmp/test_smoke.rs --json > /dev/null
          echo "CLI smoke test passed"

      - name: Baseline Regression Check
        # The corpus is proprietary and not in the public repo; this step only
        # runs where corpus/targets exists (private runners / maintainer setups).
        if: ${{ hashFiles('corpus/targets/**') != '' }}
        run: |
          binary="./target/release/frensense"
          baseline="corpus/baselines/targets.json"
          mkdir -p "$(dirname "$baseline")"
          echo "Emitting baseline for corpus targets..."
          "$binary" corpus/targets --json --emit-baseline "$baseline" 2>&1
          # Clear the file cache so the comparison run does the same full analysis
          rm -f corpus/targets/.frensense/cache.json
          echo "Checking baseline comparison against corpus targets..."
          "$binary" corpus/targets --json --compare-baseline "$baseline" 2>&1
          echo "Baseline regression check passed"

      - name: MCP Binary Smoke Test
        run: |
          binary="./target/debug/frensense-mcp"
          echo '{"jsonrpc":"2.0","id":1,"method":"ping"}' | timeout 5 "$binary" || true
          echo "MCP smoke test passed"

  # --- Performance Regression ---
  bench:
    name: Performance Regression
    runs-on: ubuntu-latest
    needs: [test-rust]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.16.1
        with:
          egress-policy: audit

      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v4.3.0

      - name: Install Rust
        uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # stable
      - name: Setup Rust Cache
        uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2.8.1

      - name: Install cargo-criterion
        run: cargo install cargo-criterion --locked --force

      - name: Run Benchmarks
        run: cargo criterion --message-format json | tee raw_output.json

      - name: Convert results to benchmark-action format
        run: >
          jq -s '[.[] | select(.reason == "benchmark-complete") | {name: .id, unit: .unit, value: .median.estimate, range: (.median_abs_dev.estimate | tostring)}]' raw_output.json > output.txt

      - name: Store and Compare Benchmark Results
        uses: benchmark-action/github-action-benchmark@fd31771ce86cc65eab85653da103f71ab1b4479c # v1.9.0
        with:
          name: FrenSense Engine Benchmarks
          tool: customSmallerIsBetter
          output-file-path: output.txt
          github-token: ${{ secrets.GITHUB_TOKEN }}
          auto-push: true
          gh-pages-branch: gh-pages
          benchmark-data-dir-path: dev/bench
          alert-threshold: '125%'
          comment-on-alert: true
          fail-on-alert: true
          comment-always: true
          summary-always: true

  # --- Public benchmark dashboard ---
  pages:
    name: Publish Benchmark Dashboard
    runs-on: ubuntu-latest
    needs: [bench]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    permissions:
      contents: write
      pages: write
      id-token: write

    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.16.1
        with:
          egress-policy: audit

      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v4.3.0
        with:
          ref: gh-pages
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify benchmark data exists
        run: |
          if [ ! -f dev/bench/index.html ]; then
            echo "No benchmark data found - first run, this is expected"
            exit 0
          fi
          echo "Benchmark dashboard at dev/bench/index.html - $(wc -l < dev/bench/index.html) lines"

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@329bcc8f12caed2cefe5a5b80781499a6f3b361b # v4.0.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: .
          keep_files: true
          user_name: 'github-actions[bot]'
          user_email: 'github-actions[bot]@users.noreply.github.com'
          commit_message: 'chore: update benchmark dashboard [skip ci]'


  benchmark-apps:
    name: App Benchmarks (Juice Shop & NodeGoat)
    runs-on: ubuntu-latest
    needs: [test-rust]
    permissions:
      contents: read
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.16.1
        with:
          egress-policy: audit

      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v4.3.0

      - name: Install Rust
        uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # stable
      - name: Setup Rust Cache
        uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2.8.1

      - name: Build Frensense (Release)
        run: cargo build --release

      - name: Clone OWASP Juice Shop
        run: git clone --depth 1 https://github.com/juice-shop/juice-shop.git ../juice-shop

      - name: Clone OWASP NodeGoat
        run: git clone --depth 1 https://github.com/OWASP/NodeGoat.git ../NodeGoat

      - name: Run Juice Shop Benchmark
        run: |
          echo "## Juice Shop Benchmark Results" >> $GITHUB_STEP_SUMMARY
          echo '```text' >> $GITHUB_STEP_SUMMARY
          JUICE_SHOP_DIR=../juice-shop FRENSENSE_BIN=./target/release/frensense python3 scripts/benchmark_juice_shop.py >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

      - name: Run NodeGoat Benchmark
        run: |
          echo "## NodeGoat Benchmark Results" >> $GITHUB_STEP_SUMMARY
          echo '```text' >> $GITHUB_STEP_SUMMARY
          NODEGOAT_DIR=../NodeGoat FRENSENSE_BIN=./target/release/frensense python3 scripts/benchmark_nodegoat.py >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
