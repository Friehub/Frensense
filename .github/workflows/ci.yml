name: GenSense CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  CARGO_TERM_COLOR: always

jobs:
  # --- Quality Assurance ---
  qa:
    name: Quality Assurance (Rust)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          
      - name: Cache Cargo dependencies
        uses: actions/cache@v3
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          
      - name: Enforce Style (rustfmt)
        run: cargo fmt --all -- --check
        
      - name: Semantic Lints (Clippy)
        run: cargo clippy --all-targets --features cli -- -D warnings

  # --- Security Audit ---
  security:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Install cargo-audit
        run: cargo install cargo-audit --no-default-features --features=fix
        
      - name: Dependency Vulnerability Check
        run: cargo audit

  # --- Correctness (Rust) ---
  test-rust:
    name: Rust Tests
    runs-on: ubuntu-latest
    needs: [qa]
    steps:
      - uses: actions/checkout@v4
      
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        
      - name: Run Full Regression Suite
        run: cargo test --features cli

  # --- Correctness (Node.js Bindings) ---
  test-node:
    name: Node.js Binding Verification
    runs-on: ubuntu-latest
    needs: [qa]
    steps:
      - uses: actions/checkout@v4
      
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'
          cache: 'npm'
          
      - name: Install dependencies
        run: npm install
        
      - name: Build Native Addon
        run: npm run build:debug
        
      - name: Verify JS Bridge
        run: npm test

  # --- Documentation Deployment ---
  deploy-docs:
    name: Deploy Documentation
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    needs: [test-rust, test-node]
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Install dependencies
        run: npm ci || npm install
      - name: Generate Rule Docs
        run: |
          cargo run --features cli -- --generate-docs
          mv RULES.md docs/rules.md
      - name: Build VitePress Site
        run: npm run docs:build
      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./docs/.vitepress/dist
