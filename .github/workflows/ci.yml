name: GenSense CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  CARGO_TERM_COLOR: always

# Top-level default — most restrictive
permissions:
  contents: read

jobs:
  # --- Quality Assurance ---
  qa:
    name: Quality Assurance (Rust)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@0080882f63886ee327175c92c554523315e07671 # v2.10.2
        with:
          egress-policy: audit

      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      
      - name: Install Rust
        uses: dtolnay/rust-toolchain@4305bc73974b4c2e4df9e72db5c5bb65f09a27a # stable
        with:
          components: rustfmt, clippy
          
      - name: Cache Cargo dependencies
        uses: actions/cache@0c45773b623bec8c7ef49597c356020e4d293810 # v4.1.1
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/cache/
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          
      - name: Enforce Style (rustfmt)
        run: cargo fmt --all -- --check
        
      - name: Semantic Lints (Clippy)
        run: cargo clippy --all-targets --features full -- -D warnings

  # --- Supply Chain Audit ---
  security:
    name: Supply Chain Audit
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@0080882f63886ee327175c92c554523315e07671 # v2.10.2
        with:
          egress-policy: audit

      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: EmbarkStudios/cargo-deny-action@3f4a70b6d2146e2797615024734898144b611c03 # v2.0.1
        with:
          command: check advisories licenses bans

  # --- NPM Security Audit ---
  npm-security:
    name: NPM Security Audit
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@0080882f63886ee327175c92c554523315e07671 # v2.10.2
        with:
          egress-policy: audit

      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@3932cf5a60c0f9a4a621746c19a9d70104961559 # v4.1.0
        with:
          node-version: '20'
      - run: npm ci
      - run: npm audit --omit=dev --audit-level=high

  # --- Static Analysis (SAST) ---
  semgrep:
    name: SAST (Semgrep)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    container:
      image: semgrep/semgrep
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@0080882f63886ee327175c92c554523315e07671 # v2.10.2
        with:
          egress-policy: audit

      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - run: semgrep scan --config=p/rust --config=p/secrets --error

  # --- MSRV Check ---
  msrv:
    name: MSRV Check (1.77)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@0080882f63886ee327175c92c554523315e07671 # v2.10.2
        with:
          egress-policy: audit

      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: dtolnay/rust-toolchain@4305bc73974b4c2e4df9e72db5c5bb65f09a27a # stable
        with:
          toolchain: 1.77
      - run: cargo check --all-features

  # --- Correctness (Rust) ---
  test-rust:
    name: Rust Tests (${{ matrix.features }})
    runs-on: ubuntu-latest
    needs: [qa]
    permissions:
      contents: read
    strategy:
      matrix:
        features: [cli, "full", "rust,typescript,solidity"]
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@0080882f63886ee327175c92c554523315e07671 # v2.10.2
        with:
          egress-policy: audit

      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      
      - name: Install Rust
        uses: dtolnay/rust-toolchain@4305bc73974b4c2e4df9e72db5c5bb65f09a27a # stable
        
      - name: Run Full Regression Suite
        run: cargo test --features ${{ matrix.features }}

  # --- Correctness (Node.js Bindings) ---
  test-node:
    name: Node.js Binding Verification
    runs-on: ubuntu-latest
    needs: [qa]
    permissions:
      contents: read
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@0080882f63886ee327175c92c554523315e07671 # v2.10.2
        with:
          egress-policy: audit

      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      
      - name: Install Rust
        uses: dtolnay/rust-toolchain@4305bc73974b4c2e4df9e72db5c5bb65f09a27a # stable
        
      - name: Setup Node.js
        uses: actions/setup-node@3932cf5a60c0f9a4a621746c19a9d70104961559 # v4.1.0
        with:
          node-version: '20'
          cache: 'npm'
          
      - name: Install dependencies
        run: npm ci || npm install
        
      - name: Build Native Addon
        run: npm run build:debug
        
      - name: Verify JS Bridge
        run: npm test

  # --- Documentation Deployment ---
  deploy-docs:
    name: Deploy Documentation
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    needs: [test-rust, test-node]
    permissions:
      contents: write
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@0080882f63886ee327175c92c554523315e07671 # v2.10.2
        with:
          egress-policy: audit

      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Setup Node
        uses: actions/setup-node@3932cf5a60c0f9a4a621746c19a9d70104961559 # v4.1.0
        with:
          node-version: 20
          cache: 'npm'
      - name: Install Rust
        uses: dtolnay/rust-toolchain@4305bc73974b4c2e4df9e72db5c5bb65f09a27a # stable
      - name: Install dependencies
        run: npm ci || npm install
      - name: Generate Rule Docs
        run: |
          cargo run --features cli -- --generate-docs
          mv RULES.md docs/rules.md
      - name: Build VitePress Site
        run: npm run docs:build
      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@4f9cc6602d3f66b9c108549d231e62369c1bc84 # v4.0.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./docs/.vitepress/dist
