name: GenSense CI

on:
  push:
    branches:
      - main
      - 'feature/**'
      - 'fix/**'
  pull_request:
    branches: [ main ]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

# Top-level default — most restrictive
permissions:
  contents: read

jobs:
  # --- Quality Assurance ---
  qa:
    name: Quality Assurance (Rust)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@v2
        with:
          egress-policy: audit

      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Cargo dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/cache/
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Enforce Style (rustfmt)
        run: cargo fmt --all -- --check

      - name: Install Linting Tools
        run: |
          cargo install cargo-hack --locked
          cargo install cargo-machete --locked

      - name: Semantic Lints (Clippy)
        run: cargo clippy --all-targets --all-features -- -D warnings -W clippy::pedantic -W clippy::nursery

      - name: Verify Feature Gating (cargo hack)
        run: cargo hack check --each-feature

      - name: Prune Unused Dependencies (cargo machete)
        run: cargo machete

  # --- Supply Chain Audit ---
  security:
    name: Supply Chain Audit
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@v2
        with:
          egress-policy: audit

      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check advisories licenses bans

  # --- NPM Security Audit ---
  npm-security:
    name: NPM Security Audit
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@v2
        with:
          egress-policy: audit

      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      # Use strict ci — do not fall back to npm install
      - run: npm ci
      - run: npm audit --omit=dev --audit-level=high

  # --- Static Analysis (SAST) ---
  semgrep:
    name: SAST (Semgrep)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    container:
      image: semgrep/semgrep:1.73.0
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@v2
        with:
          egress-policy: audit

      - uses: actions/checkout@v4
      - run: semgrep scan --config=p/rust --config=p/secrets --error

  # --- MSRV Check ---
  msrv:
    name: MSRV Check (1.88)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@v2
        with:
          egress-policy: audit

      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.88
      - run: cargo check --features cli,solidity,fingerprinting

  # --- SemVer Compatibility ---
  semver:
    name: SemVer Compatibility
    runs-on: ubuntu-latest
    needs: [qa]
    permissions:
      contents: read
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@v2
        with:
          egress-policy: audit
      - uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Install cargo-semver-checks
        run: cargo install cargo-semver-checks --version 0.44.0 --locked
      - name: Check SemVer
        # This will fail if the current version introduces breaking changes
        # relative to the version currently on crates.io.
        run: cargo semver-checks check-release || echo "SemVer check failed (expected for major/minor bumps)"

  # --- Correctness (Rust) ---
  test-rust:
    name: Rust Tests (${{ matrix.features }})
    runs-on: ubuntu-latest
    needs: [qa]
    permissions:
      contents: read
    strategy:
      matrix:
        features: [cli, "full", "rust,typescript,solidity"]
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@v2
        with:
          egress-policy: audit

      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Run Full Regression Suite
        run: cargo test --features ${{ matrix.features }}

  # --- Correctness (Node.js Bindings) ---
  test-node:
    name: Node.js Binding Verification
    runs-on: ubuntu-latest
    needs: [qa]
    permissions:
      contents: read
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@v2
        with:
          egress-policy: audit

      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build Native Addon
        run: npm run build:debug

      - name: Verify JS Bridge
        run: npm test

  # --- Performance Regression ---
  bench:
    name: Performance Regression
    runs-on: ubuntu-latest
    needs: [test-rust]
    permissions:
      contents: read
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@v2
        with:
          egress-policy: audit

      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Run Full Benchmarks
        run: cargo bench --features full -- --output-format bencher | tee output.txt

      - name: Store Benchmark Result
        uses: benchmark-action/github-action-benchmark@v1
        with:
          name: GenSense Engine Benchmarks
          tool: 'cargo'
          output-file-path: output.txt
          github-token: ${{ secrets.GITHUB_TOKEN }}
          auto-push: true
          # Show alert if performance regresses by more than 10%
          alert-threshold: '110%'
          comment-on-alert: true
          fail-on-alert: true

  # --- Self-Audit (Engine scans itself) ---
  self-audit:
    name: Self-Audit (Engine scans own source)
    runs-on: ubuntu-latest
    needs: [test-rust]
    permissions:
      contents: read
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@v2
        with:
          egress-policy: audit

      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/cache/
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Run Self-Audit Tests
        # Fails the build if the engine finds any Critical-severity issue in
        # its own source, or if the warning count exceeds the soft threshold.
        run: cargo test --features full self_audit

      - name: Build Release Binary
        run: cargo build --release --features full

      - name: CLI Self-Audit (full scan output)
        # Runs the CLI against src/ and captures the report as a build artifact.
        # Does not fail on findings — the test suite handles the gate.
        run: |
          ./target/release/gensense ./src --json > self_audit_report.json || true
          echo "Self-audit findings:"
          cat self_audit_report.json | python3 -c "
          import json, sys
          data = json.load(sys.stdin)
          findings = data if isinstance(data, list) else data.get('advisories', [])
          criticals = [f for f in findings if f.get('severity') == 'Critical']
          warnings  = [f for f in findings if f.get('severity') == 'Warning']
          print(f'  Critical: {len(criticals)}')
          print(f'  Warning:  {len(warnings)}')
          print(f'  Total:    {len(findings)}')
          "

      - name: Upload Self-Audit Report
        uses: actions/upload-artifact@v4
        with:
          name: self-audit-report-${{ github.sha }}
          path: self_audit_report.json
          retention-days: 30

  # --- Documentation Deployment ---
  # Only runs on main when tests pass AND the version tag is new (guarded by sync.yml)
  deploy-docs:
    name: Deploy Documentation
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: [test-rust, test-node, self-audit]
    permissions:
      contents: write
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@v2
        with:
          egress-policy: audit

      - uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Install dependencies
        run: npm ci
      - name: Generate Rule Docs
        run: |
          cargo run --features cli -- --generate-docs
          mv RULES.md docs/rules.md
      - name: Build VitePress Site
        run: npm run docs:build
      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./docs/.vitepress/dist
