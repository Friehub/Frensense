name: Auto Sync & Tag

on:
  push:
    branches:
      - main

concurrency:
  group: sync-${{ github.ref }}
  cancel-in-progress: false

# Restrict permissions as much as possible
permissions:
  contents: write

jobs:
  sync-and-tag:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    # Skip if this is already a version-sync commit to prevent loops
    if: |
      !contains(github.event.head_commit.message, 'chore: prepare v') &&
      !contains(github.event.head_commit.message, 'chore: sync version to Cargo.toml')
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@91182cccc01eb5e619899d80e4e971d6181294a7 # v2.10.1
        with:
          egress-policy: audit

      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: 20

      - name: Sync Versions
        run: node scripts/sync-version.js

      - name: Check for version change
        id: version_check
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "current_version=$VERSION" >> $GITHUB_OUTPUT
          if git rev-parse "v$VERSION" > /dev/null 2>&1; then
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
          fi

      - name: Commit sync if needed
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          # Stage all files the sync script may have touched
          git add Cargo.toml package.json
          git diff --quiet && git diff --staged --quiet || \
            (git commit -m "chore: sync version to Cargo.toml [skip ci]" && git push)

      - name: Create and Push Tag
        if: steps.version_check.outputs.exists == 'false'
        run: |
          VERSION=${{ steps.version_check.outputs.current_version }}
          git tag "v$VERSION"
          git push origin "v$VERSION"
