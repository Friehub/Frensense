name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch: {}

jobs:
  # 1. Build Native Artifacts for all platforms
  build-native:
    name: Build Native (${{ matrix.settings.target }})
    runs-on: ${{ matrix.settings.host }}
    strategy:
      fail-fast: false
      matrix:
        settings:
          - host: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            bin_name: gensense
          - host: macos-latest
            target: x86_64-apple-darwin
            bin_name: gensense
          - host: macos-latest
            target: aarch64-apple-darwin
            bin_name: gensense
          - host: windows-latest
            target: x86_64-pc-windows-msvc
            bin_name: gensense.exe

    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.settings.target }}

      - name: Install dependencies
        run: npm install

      - name: Build NAPI Library
        run: npm run build -- --target ${{ matrix.settings.target }}

      - name: Build CLI Binary
        run: cargo build --release --features cli --target ${{ matrix.settings.target }}

      - name: Upload NAPI Artifact
        uses: actions/upload-artifact@v4
        with:
          name: library-${{ matrix.settings.target }}
          path: gensense.node

      - name: Upload CLI Artifact
        uses: actions/upload-artifact@v4
        with:
          name: cli-${{ matrix.settings.target }}
          path: target/${{ matrix.settings.target }}/release/${{ matrix.settings.bin_name }}

  # 2. Publish to Crates.io
  publish-cargo:
    name: Publish to Crates.io
    runs-on: ubuntu-latest
    needs: build-native
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Publish
        run: cargo publish --token ${{ secrets.CARGO_REGISTRY_TOKEN }} --allow-dirty

  # 3. Publish to NPM
  publish-npm:
    name: Publish to NPM
    runs-on: ubuntu-latest
    needs: build-native
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: 'https://registry.npmjs.org'

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Prepare NPM package
        run: |
          mkdir -p dist
          # Copy Linux binary as default 'gensense' for the package root
          cp artifacts/cli-x86_64-unknown-linux-gnu/gensense ./dist/gensense
          cp artifacts/library-x86_64-unknown-linux-gnu/gensense.node ./gensense.node
          
          # Copy all platform binaries for the intelligent wrapper
          mkdir -p dist/binaries
          cp artifacts/cli-x86_64-unknown-linux-gnu/gensense ./dist/binaries/gensense-linux-x64
          cp artifacts/cli-x86_64-apple-darwin/gensense ./dist/binaries/gensense-macos-x64
          cp artifacts/cli-aarch64-apple-darwin/gensense ./dist/binaries/gensense-macos-arm64
          cp artifacts/cli-x86_64-pc-windows-msvc/gensense.exe ./dist/binaries/gensense-windows-x64.exe

      - name: Generate Rule Docs
        run: cargo run --features cli -- --generate-docs

      - name: Publish to NPM
        run: |
          echo "//registry.npmjs.org/:_authToken=${{ secrets.NPM_TOKEN }}" > .npmrc
          npm publish --tag latest --registry https://registry.npmjs.org/ --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  # 4. Create GitHub Release
  github-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: build-native
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Prepare binaries for release
        run: |
          mkdir -p release-binaries
          for dir in artifacts/cli-*/; do
            target=$(basename "$dir" | sed 's/cli-//')
            ext=""
            if [[ "$target" == *"windows"* ]]; then ext=".exe"; fi
            cp "${dir}gensense${ext}" "release-binaries/gensense-${target}${ext}"
          done
      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          files: release-binaries/*
          generate_release_notes: true
          prerelease: false
