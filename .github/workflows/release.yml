name: GenSense Release Pipeline

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Run Tests
        run: cargo test --all-features
      - name: Run Security Audit
        run: |
          cargo install cargo-audit
          cargo audit

  release:
    needs: build-and-test
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
        include:
          - os: ubuntu-latest
            artifact_name: gensense-linux
            asset_name: gensense-linux-amd64
          - os: macos-latest
            artifact_name: gensense-macos
            asset_name: gensense-macos-arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Build Full Binary
        run: cargo build --release --features full
      - name: Generate Rule Docs
        run: cargo run --release --features full -- --generate-docs
      - name: Generate SBOM
        run: ./scripts/generate-sbom.sh
      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: |
            target/release/gensense
            RULES.md
            bom.json

  create-release:
    needs: release
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/download-artifact@v4
      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            gensense-linux/gensense
            gensense-macos/gensense
            */RULES.md
            */bom.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
