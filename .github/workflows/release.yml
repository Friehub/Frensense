name: Release

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release (e.g. v0.2.1)'
        required: false

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # 0. Prepare: Decide if we should release and ensure tags exist
  prepare:
    name: Prepare Release
    runs-on: ubuntu-latest
    outputs:
      should_release: ${{ steps.check.outputs.should_release }}
      tag_name: ${{ steps.check.outputs.tag_name }}
    permissions:
      contents: write
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@v2
        with:
          egress-policy: audit

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check version and tags
        id: check
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            RAW="${{ github.event.inputs.tag }}"
            if [[ -z "$RAW" ]]; then
              RAW="$(node -p "require('./package.json').version")"
            fi
            # Normalize: strip existing v prefix, then add it back
            RAW="${RAW#v}"
            TAG="v$RAW"
            echo "should_release=true" >> $GITHUB_OUTPUT
            echo "tag_name=$TAG" >> $GITHUB_OUTPUT
          elif [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            echo "should_release=true" >> $GITHUB_OUTPUT
            echo "tag_name=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
          elif [[ "${{ github.ref }}" == refs/heads/main ]]; then
            # Check for version change
            VERSION=$(node -p "require('./package.json').version")
            TAG="v$VERSION"
            
            if git rev-parse "$TAG" >/dev/null 2>&1; then
              echo "Tag $TAG already exists. Skipping automatic release."
              echo "should_release=false" >> $GITHUB_OUTPUT
            else
              echo "New version $VERSION detected on main. Creating tag $TAG."
              git config user.name "github-actions[bot]"
              git config user.email "github-actions[bot]@users.noreply.github.com"
              
              # Attempt to sync Cargo.toml if needed (might fail due to branch protection)
              node scripts/sync-version.js
              git add Cargo.toml package.json
              if ! git diff --cached --quiet; then
                git commit -m "chore: sync version to $VERSION [skip ci]" || true
                git push origin main || echo "Failed to push version sync to main (likely branch protection). Continuing with tag."
              fi
              
              git tag "$TAG"
              git push origin "$TAG"
              
              echo "should_release=true" >> $GITHUB_OUTPUT
              echo "tag_name=$TAG" >> $GITHUB_OUTPUT
            fi
          else
            echo "should_release=false" >> $GITHUB_OUTPUT
          fi

  # 1. Build Native Artifacts for all platforms
  build-native:
    name: Build Native (${{ matrix.settings.target }})
    needs: prepare
    if: needs.prepare.outputs.should_release == 'true'
    runs-on: ${{ matrix.settings.host }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        settings:
          - host: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            bin_name: frensense
          - host: macos-latest
            target: x86_64-apple-darwin
            bin_name: frensense
          - host: macos-14
            target: aarch64-apple-darwin
            bin_name: frensense
          - host: windows-latest
            target: x86_64-pc-windows-msvc
            bin_name: frensense.exe

    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@v2
        with:
          egress-policy: audit

      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.tag_name }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.settings.target }}

      - name: Install dependencies
        run: npm ci

      - name: Build NAPI Library
        run: npm run build

      - name: Smoke test NAPI library
        run: |
          node -e "
            const m = require('./frensense.node');
            const api = new m.FrenSenseEngine();
            const r = api.auditContent('test.rs', 'fn main() { let x = 1; }');
            console.log('NAPI OK -', r.length, 'findings');
          "

      - name: Smoke test NAPI library
        run: |
          node -e "
            const m = require('./frensense.node');
            const api = new m.FrenSenseEngine();
            const r = api.auditContent('test.rs', 'fn main() { let x = 1; }');
            const p = JSON.parse(r);
            console.log('NAPI OK -', p.length, 'findings');
          "

      - name: Build CLI Binary
        run: cargo build --release --target ${{ matrix.settings.target }}

      - name: Smoke test CLI binary
        shell: bash
        run: |
          binary="target/${{ matrix.settings.target }}/release/${{ matrix.settings.bin_name }}"
          file "$binary" || true
          "$binary" --version
          "$binary" --help
          echo 'fn main() { let x = 1; }' > /tmp/test_smoke.rs
          "$binary" /tmp/test_smoke.rs --json > /dev/null
          echo "CLI smoke test passed"

      - name: Upload NAPI Artifact
        uses: actions/upload-artifact@v4
        with:
          name: library-${{ matrix.settings.target }}
          path: gensense.node

      - name: Upload CLI Artifact
        uses: actions/upload-artifact@v4
        with:
          name: cli-${{ matrix.settings.target }}
          path: target/${{ matrix.settings.target }}/release/${{ matrix.settings.bin_name }}

  # 2. Generate Hashes for SLSA
  generate-hashes:
    name: Generate Hashes
    runs-on: ubuntu-latest
    needs: [prepare, build-native]
    permissions:
      contents: read
    outputs:
      hashes: ${{ steps.hash.outputs.hashes }}
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@v2
        with:
          egress-policy: audit
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Generate hashes
        id: hash
        run: |
          cd artifacts
          find . -type f | xargs sha256sum | base64 -w0 > hashes.txt
          echo "hashes=$(cat hashes.txt)" >> $GITHUB_OUTPUT

  # 3. SLSA Provenance
  provenance:
    needs: [prepare, generate-hashes]
    permissions:
      actions: read
      id-token: write
      contents: write
    uses: slsa-framework/slsa-github-generator/.github/workflows/generator_generic_slsa3.yml@v2.0.0
    with:
      base64-subjects: ${{ needs.generate-hashes.outputs.hashes }}
      upload-assets: true

  # 4. Publish to Crates.io
  publish-cargo:
    name: Publish to Crates.io
    runs-on: ubuntu-latest
    needs: [prepare, build-native]
    environment: production
    permissions:
      contents: read
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@v2
        with:
          egress-policy: audit
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.tag_name }}
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Check version not already published
        run: |
          VERSION=$(grep '^version' Cargo.toml | head -1 | cut -d'"' -f2)
          if cargo search frensense --limit 1 2>/dev/null | grep -q "\"$VERSION\""; then
            echo "Version $VERSION already exists on crates.io. Skipping."
            exit 0
          fi
      - name: Publish
        run: |
          cargo publish \
            --token ${{ secrets.CARGO_REGISTRY_TOKEN }} \
            --no-default-features \
            --features rust,typescript,fingerprinting

  # 5. Publish to NPM
  publish-npm:
    name: Publish to NPM
    runs-on: ubuntu-latest
    needs: [prepare, build-native]
    environment: production
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@v2
        with:
          egress-policy: audit
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.tag_name }}
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: 'https://registry.npmjs.org'
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Install dependencies
        run: npm ci

      - name: Prepare NPM package
        run: |
          mkdir -p dist/binaries

          # CLI binaries (platform-named for the postinstall resolver)
          cp artifacts/cli-x86_64-unknown-linux-gnu/frensense    ./dist/frensense
          cp artifacts/cli-x86_64-unknown-linux-gnu/frensense    ./dist/binaries/frensense-linux-x64
          cp artifacts/cli-x86_64-apple-darwin/frensense          ./dist/binaries/frensense-macos-x64
          cp artifacts/cli-aarch64-apple-darwin/frensense          ./dist/binaries/frensense-macos-arm64
          cp artifacts/cli-x86_64-pc-windows-msvc/frensense.exe   ./dist/binaries/frensense-windows-x64.exe

          # NAPI .node files — MUST use napi-rs platform naming so frensense.js
          # can resolve the correct binary at runtime on each OS.
          cp artifacts/library-x86_64-unknown-linux-gnu/frensense.node  ./frensense.linux-x64-gnu.node
          cp artifacts/library-x86_64-apple-darwin/frensense.node        ./frensense.darwin-x64.node
          cp artifacts/library-aarch64-apple-darwin/frensense.node        ./frensense.darwin-arm64.node
          cp artifacts/library-x86_64-pc-windows-msvc/frensense.node     ./frensense.win32-x64-msvc.node

      - name: Generate Rule Docs
        run: |
          cargo run -- --generate-docs

      - name: Test NPM package before publish
        run: |
          PACKAGE=$(npm pack --silent 2>&1 | tail -1)
          echo "Package: $PACKAGE"
          TESTDIR=$(mktemp -d)
          cd "$TESTDIR"
          npm init -y > /dev/null
          npm install "$GITHUB_WORKSPACE/$PACKAGE" > /dev/null 2>&1
          npx frensense --version
          echo 'fn main() { let x = 1; }' > test.rs
          npx frensense test.rs --json > /dev/null
          node -e "
            const { FrenSense } = require('@friehub/frensense');
            const engine = new FrenSense();
            const r = engine.auditContent('test.rs', 'fn main() { let x = 1; }');
            console.log('NPM package OK -', r.length, 'findings');
          "

      - name: Check version not already published
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if npm view @friehub/frensense@$VERSION version 2>/dev/null | grep -q "$VERSION"; then
            echo "Version $VERSION already exists on NPM. Skipping."
            exit 0
          fi

      - name: Publish to NPM
        run: npm publish --tag latest --registry https://registry.npmjs.org/ --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  # 6. Create GitHub Release
  github-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: [prepare, build-native, provenance]
    environment: production
    permissions:
      contents: write
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@v2
        with:
          egress-policy: audit
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.tag_name }}
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Prepare binaries for release
        run: |
          mkdir -p release-binaries
          for dir in artifacts/cli-*/; do
            target=$(basename "$dir" | sed 's/cli-//')
            ext=""
            if [[ "$target" == *"windows"* ]]; then ext=".exe"; fi
            cp "${dir}frensense${ext}" "release-binaries/frensense-${target}${ext}"
          done
      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.prepare.outputs.tag_name }}
          files: release-binaries/*
          generate_release_notes: true
          prerelease: false
