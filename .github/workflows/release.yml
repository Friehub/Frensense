name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  # 1. Build Native Binaries for all platforms
  build-native:
    name: Build Native (${{ matrix.settings.target }})
    runs-on: ${{ matrix.settings.host }}
    strategy:
      fail-fast: false
      matrix:
        settings:
          - host: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            architecture: x64
          - host: macos-latest
            target: x86_64-apple-darwin
            architecture: x64
          - host: macos-latest
            target: aarch64-apple-darwin
            architecture: arm64
          - host: windows-latest
            target: x86_64-pc-windows-msvc
            architecture: x64

    steps:
      - uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.settings.target }}

      - name: Install dependencies
        run: npm install

      - name: Build
        run: npm run build -- --target ${{ matrix.settings.target }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: bindings-${{ matrix.settings.target }}
          path: gensense.node

  # 2. Publish to Crates.io (Rust Library)
  publish-cargo:
    name: Publish to Crates.io
    runs-on: ubuntu-latest
    needs: build-native
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Publish
        run: cargo publish --token ${{ secrets.CARGO_REGISTRY_TOKEN }}
        continue-on-error: true # Unstable version might have issues

  # 3. Publish to NPM (Node.js Package)
  publish-npm:
    name: Publish to NPM
    runs-on: ubuntu-latest
    needs: build-native
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: 'https://registry.npmjs.org'

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Prepare NPM package
        run: |
          mkdir -p dist
          # Copy artifacts to expected locations for the multi-platform loader
          cp artifacts/bindings-x86_64-unknown-linux-gnu/gensense.node ./gensense.node
          # (Simplified for alpha: in full release, we'd use NAPI universal packages)

      - name: Generate Rule Docs
        run: cargo run --features cli -- --generate-docs

      - name: Publish to NPM
        run: npm publish --tag alpha --registry https://registry.npmjs.org/
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish to GitHub Packages
        run: npm publish --tag alpha --registry https://npm.pkg.github.com/
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # 4. Deploy Documentation (GitHub Pages)
  deploy-docs:
    name: Deploy Documentation
    runs-on: ubuntu-latest
    needs: publish-npm
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Install dependencies
        run: npm ci || npm install
      - name: Generate Rule Docs
        run: |
          cargo run --features cli -- --generate-docs
          mv RULES.md docs/rules.md
      - name: Build VitePress Site
        run: npm run docs:build
      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./docs/.vitepress/dist

  # 5. Create GitHub Release
  github-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: build-native
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          
      - name: Prepare binaries for release
        run: |
          mkdir -p release-binaries
          for dir in artifacts/bindings-*/; do
            target=$(basename "$dir" | sed 's/bindings-//')
            cp "${dir}gensense.node" "release-binaries/gensense-${target}.node"
          done
          
      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          files: release-binaries/*
          generate_release_notes: true
